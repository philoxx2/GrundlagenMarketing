   a:"<b>Kommissionsvertrieb</b>; <b>Vertriebsbindungssysteme</b> (räuml./personelle/zeitl. Bindung an einen Absatzweg); <b>Alleinvertriebssysteme</b> (zusätzlich quantitative Selektion, Ausschließlichkeitsrecht); <b>Vertragshändlersysteme</b> (im eigenen Namen/Rechnung, absatzförderungspflichtig); <b>Franchise-System</b> (Geber räumt Nehmer gegen Entgelt Nutzungsrechte an Namen/Zeichen/Ausstattung ein)."},
  {c:"k6kontr", q:"Mitarbeiter im Vertrieb — Rollen und Motivationslogik?",
   a:"Rollen: <b>Vertriebsleitung</b>, <b>Innendienst</b> (inkl. Call-Center), <b>Außendienst</b>, <b>(Key) Account Management</b>. Entscheidungen: Verkaufsbezirke, Besuchshäufigkeiten, Quoten, Schulung, Anreizsysteme, Routen. Motivationskette: <b>Motivation → Bemühung → Performance → Vergütung → Zufriedenheit</b>."},
  {c:"k6kontr", q:"Vergütungssysteme im Vertrieb — Ziele, Merkmale, Arten?",
   a:"<b>Ziele:</b> Motivation, leistungsgerechte Vergütung, Vertriebssteuerung (Synchronisation von Unternehmens- und Mitarbeiterinteressen). <b>Merkmale guter Systeme:</b> Einfachheit, Flexibilität, Fairness, Anreizkompatibilität. <b>Arten:</b> Festgehalt, Provisionssysteme (→ „Umsatz-Preis-Dilemma“), Prämien/Ziel-Bonus-Modelle, Gratifikationen. Problem: Erfolg hängt auch von externen, unsicheren Faktoren ab."},
  {c:"k6kontr", q:"Vertreter vs. Reisender — Gewinnvergleichsrechnung?",
   a:"Kostenvergleich: <code>K_R = f_R + q_R·U</code> vs. <code>K_V = f_V + q_V·U</code>. Der <b>kritische Umsatz</b> (K<sub>R</sub>=K<sub>V</sub>) ist <code>U_k = (f_R − f_V)/(q_V − q_R)</code>. Faustregel: bei <b>niedrigem Umsatz</b> ist der <b>Vertreter</b> (geringes Fixum) günstiger, bei <b>hohem Umsatz</b> der <b>Reisende</b> (geringere Umsatzprovision)."},

  // ===== KAP 6 – Logistik =====
  {c:"k6log", q:"Logistiksysteme — Definition, Ziel („6 R“) und Elemente?",
   a:"<b>Überbrückung räumlicher/zeitlicher Distanzen</b> zwischen Erstellung und Inanspruchnahme von Leistungen inkl. Informationen. Ziel („6 R“): das <b>richtige Produkt</b> in der <b>richtigen Menge</b> am <b>richtigen Ort</b> zur <b>richtigen Zeit</b> im <b>richtigen Zustand</b> zu <b>minimalen Kosten</b>. Elemente: <b>Auftragsabwicklung</b>, <b>Lagerhaltung</b>, <b>Transport</b>."},

  // ===== EXKURS – Nachhaltigkeit =====
  {c:"exnach", q:"Green Marketing vs. Sustainable Marketing vs. Greenwashing?",
   a:"<b>Green Marketing:</b> Fokus auf umweltfreundliche Produkte. <b>Sustainable Marketing:</b> ganzheitlicher Ansatz inkl. sozialer Verantwortung, orientiert an der <b>Triple Bottom Line (People, Planet, Profit)</b>. <b>Greenwashing:</b> sich ein „grünes“ Image geben (v. a. über Kommunikation), ohne echte nachhaltige Aktivitäten im operativen Geschäft → Risiko: <b>Vertrauensverlust/Reputationsschaden</b>."},
  {c:"exnach", q:"Die vier Phasen des Green Marketing (1.0–4.0)?",
   a:"<b>1.0</b> Öko-Nischen (z. B. Bio-Hofladen) → <b>2.0</b> Etablierung in Märkten (z. B. Bio-Eigenmarken) → <b>3.0</b> Werte-/Strukturwandel (z. B. Patagonia) → <b>4.0</b> vernetzte Communities, Transformation, <b>Circular Economy</b> und Mixed-Zone-Marketing."},
  {c:"exnach", q:"Treiber des nachhaltigen Marketings?",
   a:"<b>Regulierung/Politik</b> (EU Green Deal, 17 SDGs), <b>Konsumentenerwartungen</b> (LOHAS, Gen Z), <b>Technologie</b> (KI, 3D-Druck, digitale Plattformen, Blockchain zur Lieferketten-Rückverfolgung) und <b>CSR/Reputationsmanagement</b>. LOHAS = „Lifestyles of Health and Sustainability“."},
  {c:"exnach", q:"Strategisches vs. operatives Nachhaltigkeitsmarketing?",
   a:"<b>Strategisch:</b> Zielgruppen wie „Eco-Prosumer“, Integration in die Unternehmensstrategie (Differenzierung als Wettbewerbsvorteil), nachhaltige Wertschöpfung (Triple Bottom Line). <b>Operativ (je 4 P):</b> Produkt = Ökodesign/Langlebigkeit; Preis = Hochpreis/Mischkalkulation; Kommunikation = Green Claims/Umweltzeichen/Storytelling (Risiko Greenwashing); Distribution = nachhaltige Lieferketten/Packaging."},
  {c:"exnach", q:"Zentrale Herausforderungen des nachhaltigen Marketings?",
   a:"<b>Konsum-Paradoxon:</b> Einstellung ≠ Verhalten. <b>Greenwashing-Risiko:</b> Vertrauensverlust. <b>Zielkonflikte</b> zwischen ökologischen, ökonomischen und sozialen Zielen. Fazit: Nachhaltigkeit ist keine Option, sondern Notwendigkeit — glaubwürdiges Handeln und tiefgreifende Transformation sind erforderlich."},];

// ---------- engine ----------
CARDS.forEach((c,i)=>{c.id="all_"+i; c.kap=CAT2KAP[c.c];});
let status={}, filter="all", onlyReview=false, order=[], pos=0;
const $=s=>document.querySelector(s);
const card=$("#card"), stage=$("#stage"), chipsEl=$("#chips");

const STKEY="marketing_all_status";
async function loadStatus(){
  try{ if(window.storage){ const r=await window.storage.get(STKEY); if(r&&r.value){ status=JSON.parse(r.value); return; } } }catch(e){}
  try{ const v=localStorage.getItem(STKEY); if(v) status=JSON.parse(v); }catch(e){}
}
async function saveStatus(){
  const v=JSON.stringify(status);
  try{ if(window.storage){ await window.storage.set(STKEY, v); } }catch(e){}
  try{ localStorage.setItem(STKEY, v); }catch(e){}
}

function chip(k,label,color,n){return '<button class="chip" data-k="'+k+'" style="--c:'+color+'"><span class="dot" style="color:'+color+'"></span>'+label+'<span class="n">'+n+'</span></button>';}
function buildChips(){
  const counts={}; CARDS.forEach(c=>counts[c.kap]=(counts[c.kap]||0)+1);
  let html=chip("all","Alle","#14232f",CARDS.length);
  for(const k in KAPS) html+=chip(k,KAPS[k].label,KAPS[k].color,counts[k]||0);
  chipsEl.innerHTML=html;
  chipsEl.querySelectorAll(".chip").forEach(el=>el.onclick=()=>{
    filter=el.dataset.k; rebuild();
    el.scrollIntoView({behavior:"smooth",inline:"center",block:"nearest"});
  });
}
function rebuild(){
  chipsEl.querySelectorAll(".chip").forEach(el=>{
    const on=el.dataset.k===filter; el.classList.toggle("on",on);
    el.style.background = on ? el.style.getPropertyValue("--c") : "";
  });
  let deck=CARDS.filter(c=> filter==="all"||c.kap===filter);
  if(onlyReview) deck=deck.filter(c=> status[c.id]==="again");
  order=deck.map(c=>c.id); pos=0; render();
}
function currentCard(){ return CARDS.find(c=>c.id===order[pos]); }
function render(){
  updateStats();
  if(order.length===0){
    card.style.display="none";
    if(!$("#emptyMsg")){const d=document.createElement("div");d.className="empty";d.id="emptyMsg";stage.appendChild(d);}
    $("#emptyMsg").textContent=onlyReview?"Keine „Nochmal“-Karten hier. 🎉":"Keine Karten in dieser Auswahl.";
    $("#emptyMsg").style.display="block"; $("#counter").textContent="0 / 0";
    ["prev","next","flip","again","knownBtn"].forEach(id=>$("#"+id).disabled=true);
    $("#prog").style.width="0%"; return;
  }
  if($("#emptyMsg")) $("#emptyMsg").style.display="none";
  card.style.display="";
  ["prev","next","flip","again","knownBtn"].forEach(id=>$("#"+id).disabled=false);
  $("#prev").disabled=pos===0; $("#next").disabled=pos===order.length-1;
  const c=currentCard(), t=THEMES[c.c], col=t.color;
  card.classList.remove("flipped"); card.style.setProperty("--spine",col);
  $("#tagF").textContent=t.label; $("#tagB").textContent=t.label;
  $("#tagF").style.color=col; $("#tagB").style.color=col;
  $("#frontQ").textContent=c.q; $("#backQ").textContent=c.q; $("#backA").innerHTML=c.a;
  card.querySelectorAll(".face").forEach(f=>f.scrollTop=0);
  $("#counter").textContent=(pos+1)+" / "+order.length;
  $("#prog").style.width=((pos+1)/order.length*100)+"%";
  markFlipHint();
}
function markFlipHint(){
  const c=currentCard(); if(!c) return; const s=status[c.id];
  $("#again").classList.toggle("sel", s==="again");
  $("#knownBtn").classList.toggle("sel", s==="known");
}
function updateStats(){
  let k=0,a=0; CARDS.forEach(c=>{if(status[c.id]==="known")k++;else if(status[c.id]==="again")a++;});
  $("#cKnown").textContent=k; $("#cAgain").textContent=a; $("#cOpen").textContent=CARDS.length-k-a;
}
function flip(){ if(order.length) card.classList.toggle("flipped"); }
function go(d){ const n=pos+d; if(n>=0&&n<order.length){pos=n;render();} }
function mark(s){
  const c=currentCard(); if(!c) return;
  status[c.id]=status[c.id]===s?undefined:s; if(!status[c.id]) delete status[c.id];
  saveStatus(); updateStats(); markFlipHint();
  if(status[c.id] && pos<order.length-1){ setTimeout(()=>go(1),170); }
  else if(status[c.id]==="known" && onlyReview){ rebuild(); }
}
function shuffle(){ for(let i=order.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[order[i],order[j]]=[order[j],order[i]];} pos=0;render(); }

// --- Touch: Wischen = blättern, Tippen = umdrehen ---
let tX=0,tY=0,tT=0,moved=false,suppressClick=false;
stage.addEventListener("touchstart",e=>{
  const t=e.changedTouches[0]; tX=t.clientX; tY=t.clientY; tT=Date.now(); moved=false;
},{passive:true});
stage.addEventListener("touchmove",e=>{
  const t=e.changedTouches[0];
  if(Math.abs(t.clientX-tX)>12||Math.abs(t.clientY-tY)>12) moved=true;
},{passive:true});
stage.addEventListener("touchend",e=>{
  if(!order.length) return;
  const t=e.changedTouches[0], dx=t.clientX-tX, dy=t.clientY-tY;
  suppressClick=true; setTimeout(()=>suppressClick=false,450);
  if(Math.abs(dx)>55 && Math.abs(dx)>Math.abs(dy)*1.4){ go(dx<0?1:-1); return; }
  if(!moved && Date.now()-tT<500) flip();
},{passive:true});
card.addEventListener("click",()=>{ if(!suppressClick) flip(); });
card.addEventListener("keydown",e=>{ if(e.key===" "||e.key==="Enter"){e.preventDefault();flip();} });

$("#flip").onclick=flip; $("#prev").onclick=()=>go(-1); $("#next").onclick=()=>go(1);
$("#shuffle").onclick=shuffle; $("#again").onclick=()=>mark("again"); $("#knownBtn").onclick=()=>mark("known");
$("#onlyReview").onchange=e=>{onlyReview=e.target.checked;rebuild();};
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT") return;
  if(e.key==="ArrowLeft")go(-1); else if(e.key==="ArrowRight")go(1);
  else if(e.key===" "){e.preventDefault();flip();}
  else if(e.key==="1")mark("again"); else if(e.key==="2")mark("known");
  else if(e.key.toLowerCase()==="s")shuffle();
});
(async ()=>{ await loadStatus(); buildChips(); filter="all"; rebuild(); })();
</script>
