<!doctype html>
<html lang="de">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Marketing">

<title>Karteikarten · Grundlagen des Marketings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14232f; --paper:#e9edf1; --card:#ffffff; --line:#d7dee5;
    --blue:#1a8fc9; --blue-deep:#0c5c86; --green:#4c9a53; --muted:#5b6b78;
    --chipbg:#ffffff; --dock:rgba(233,237,241,.92); --codebg:#eef3f6;
    --shadow:0 14px 34px -16px rgba(20,35,47,.45);
    --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
    --sal:env(safe-area-inset-left); --sar:env(safe-area-inset-right);
    --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --disp:'Space Grotesk','Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --ink:#e7eef4; --paper:#0f171e; --card:#182530; --line:#2b3a47;
      --blue:#4fb3e0; --blue-deep:#8fd2f2; --green:#6fc077; --muted:#93a5b3;
      --chipbg:#182530; --dock:rgba(15,23,30,.92); --codebg:#12242f;
      --shadow:0 14px 34px -16px rgba(0,0,0,.7);
    }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  html,body{margin:0;height:100%;overscroll-behavior:none}
  body{
    font-family:var(--sans);color:var(--ink);background:var(--paper);
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }
  .app{
    display:flex;flex-direction:column;
    height:100vh;height:100dvh;overflow:hidden;
    max-width:820px;margin:0 auto;
    padding:calc(var(--sat) + 10px) calc(var(--sar) + 14px) 0 calc(var(--sal) + 14px);
  }

  /* ---------- top ---------- */
  .top{flex:0 0 auto}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:9px}
  .logo{display:grid;grid-template-columns:repeat(4,6px);grid-auto-rows:6px;gap:2.5px;flex:0 0 auto}
  .logo i{display:block;border-radius:1px}
  .logo i:nth-child(1){grid-column:1;grid-row:1/4;width:8px;background:var(--blue)}
  .logo i.b{background:var(--blue)} .logo i.g{background:var(--green)}
  .brand h1{font-family:var(--disp);font-size:15px;margin:0;letter-spacing:-.2px;line-height:1.2}
  .brand p{margin:1px 0 0;font-size:11px;color:var(--muted);line-height:1.2}
  .bar{height:4px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:9px}
  .bar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--green));transition:width .3s ease}

  .chips{
    display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;
    padding-bottom:2px;margin:0 -14px 8px;padding-left:14px;padding-right:14px;
    scroll-snap-type:x proximity;
  }
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;scroll-snap-align:start;
    font:600 12.5px/1 var(--sans);color:var(--muted);background:var(--chipbg);
    border:1px solid var(--line);border-radius:99px;padding:9px 13px;cursor:pointer;
    display:flex;align-items:center;gap:6px;transition:background .15s,color .15s;
    -webkit-user-select:none;user-select:none;
  }
  .chip .dot{width:7px;height:7px;border-radius:99px;background:currentColor;opacity:.85}
  .chip.on{color:#fff;border-color:transparent}
  .chip.on .dot{background:#fff;opacity:.95}
  .chip .n{font-family:var(--mono);opacity:.7;font-size:11px;font-weight:500}

  .statusbar{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    font-size:11.5px;color:var(--muted);margin-bottom:9px;
  }
  .statusbar .counter{font-family:var(--mono);font-size:12px;color:var(--ink);font-weight:500}
  .statusbar .dots{display:flex;gap:9px;align-items:center;white-space:nowrap}
  .statusbar b{color:var(--ink);font-weight:600}
  .toggle{display:flex;align-items:center;gap:6px;cursor:pointer;-webkit-user-select:none;user-select:none}
  .toggle input{accent-color:var(--blue);width:15px;height:15px;margin:0}

  /* ---------- card ---------- */
  .stage{
    flex:1 1 auto;min-height:0;perspective:1600px;
    display:flex;touch-action:pan-y;
  }
  .card{
    position:relative;width:100%;height:100%;
    transform-style:preserve-3d;transition:transform .45s cubic-bezier(.2,.7,.2,1);
    cursor:pointer;
  }
  .card.flipped{transform:rotateY(180deg)}
  .face{
    position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
    padding:20px 20px 18px 26px;display:flex;flex-direction:column;
    overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  }
  .face::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;border-radius:16px 0 0 16px;background:var(--spine,#8a94a0)}
  .back{transform:rotateY(180deg)}
  .meta{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:11px;flex:0 0 auto}
  .tag{font:600 10.5px/1.3 var(--mono);letter-spacing:.2px;text-transform:uppercase;color:var(--spine,#8a94a0)}
  .side{font:500 10.5px var(--mono);color:var(--muted);letter-spacing:.8px;flex:0 0 auto;opacity:.8}
  .q{font-family:var(--disp);font-weight:600;font-size:19px;line-height:1.32;letter-spacing:-.3px}
  .back .q{font-size:14px;line-height:1.35;color:var(--muted);font-weight:600}
  .a{font-size:15px;line-height:1.62;margin-top:8px}
  .a b{color:var(--blue-deep)}
  .a code{font-family:var(--mono);font-size:13.5px;background:var(--codebg);padding:2px 6px;border-radius:5px;color:var(--blue-deep);display:inline-block;margin:2px 0}
  .hint{margin-top:auto;padding-top:14px;font-size:11.5px;color:var(--muted);opacity:.85;flex:0 0 auto}

  /* ---------- dock ---------- */
  .dock{
    flex:0 0 auto;
    padding:10px 0 calc(var(--sab) + 10px);
    background:var(--dock);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    display:flex;flex-direction:column;gap:8px;
  }
  .row{display:flex;gap:8px}
  button.ctl{
    font:600 15px var(--sans);border-radius:13px;cursor:pointer;
    border:1px solid var(--line);background:var(--card);color:var(--ink);
    min-height:52px;padding:0 14px;transition:opacity .15s,transform .1s;
    display:flex;align-items:center;justify-content:center;gap:7px;
    -webkit-user-select:none;user-select:none;touch-action:manipulation;
  }
  button.ctl:active{transform:scale(.97)}
  button.ctl:disabled{opacity:.35}
  .nav{flex:0 0 66px;font-size:19px}
  .primary{flex:1 1 auto;background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .util{flex:0 0 60px;font-size:17px}
  .again{flex:1;border-color:#d98a3a;color:#b06a1e;background:color-mix(in srgb,#d98a3a 10%,var(--card))}
  .known{flex:1;border-color:var(--green);color:var(--green);background:color-mix(in srgb,var(--green) 10%,var(--card))}
  .again.sel{background:#d98a3a;color:#fff}
  .known.sel{background:var(--green);color:#fff}
  .empty{margin:auto;text-align:center;color:var(--muted);font-size:15px;padding:30px 16px}

  @media (min-width:700px){
    .app{padding-left:24px;padding-right:24px}
    .brand h1{font-size:18px}.brand p{font-size:12.5px}
    .face{padding:28px 30px 24px 36px}
    .q{font-size:22px}.back .q{font-size:15px}.a{font-size:15.5px}
    .nav{flex:0 0 110px}
  }
  @media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>

<div class="app">
  <div class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true"><i></i><i class="b"></i><i class="g"></i><i class="b"></i><i class="g"></i><i class="b"></i><i class="g"></i><i class="b"></i><i class="g"></i></div>
      <div>
        <h1>Grundlagen des Marketings</h1>
        <p>Kapitel 1–6 + Exkurs · SoSe 2026</p>
      </div>
    </div>
    <div class="bar"><i id="prog"></i></div>
    <div class="chips" id="chips"></div>
    <div class="statusbar">
      <span class="counter" id="counter">–</span>
      <span class="dots">
        <label class="toggle"><input type="checkbox" id="onlyReview"> nur ↻</label>
        <span>✓ <b id="cKnown">0</b></span>
        <span>↻ <b id="cAgain">0</b></span>
        <span>offen <b id="cOpen">0</b></span>
      </span>
    </div>
  </div>

  <div class="stage" id="stage">
    <div class="card" id="card" role="button" tabindex="0" aria-label="Karte umdrehen">
      <div class="face front">
        <div class="meta"><span class="tag" id="tagF"></span><span class="side">Frage</span></div>
        <div class="q" id="frontQ"></div>
        <div class="hint">Tippen zum Umdrehen · Wischen zum Blättern</div>
      </div>
      <div class="face back">
        <div class="meta"><span class="tag" id="tagB"></span><span class="side">Antwort</span></div>
        <div class="q" id="backQ"></div>
        <div class="a" id="backA"></div>
      </div>
    </div>
  </div>

  <div class="dock">
    <div class="row">
      <button class="ctl nav" id="prev" aria-label="Zurück">←</button>
      <button class="ctl primary" id="flip">Umdrehen</button>
      <button class="ctl nav" id="next" aria-label="Weiter">→</button>
      <button class="ctl util" id="shuffle" aria-label="Mischen">🔀</button>
    </div>
    <div class="row">
      <button class="ctl again" id="again">↻ Nochmal</button>
      <button class="ctl known" id="knownBtn">✓ Gekonnt</button>
    </div>
  </div>
</div>

<script>
const KAPS = {
  kap1:{label:"Kapitel 1", color:"#1a8fc9"},
  kap2:{label:"Kapitel 2", color:"#0c5c86"},
  kap3:{label:"Kapitel 3", color:"#4c9a53"},
  kap4:{label:"Kapitel 4", color:"#d98a3a"},
  kap5:{label:"Kapitel 5", color:"#5a6ea8"},
  kap6:{label:"Kapitel 6", color:"#2f8f5b"},
  exkurs:{label:"Exkurs", color:"#159c74"},
};
const THEMES = {
  begr:{label:"K1 · Grundbegriffe",color:"#1a8fc9"}, entw:{label:"K1 · Entwicklung",color:"#0c5c86"},
  digi:{label:"K1 · Digital & heute",color:"#17a2a2"}, konz:{label:"K1 · Konzepte & Modelle",color:"#4c9a53"},
  mix:{label:"K1 · Marketing-Mix",color:"#d98a3a"}, bez:{label:"K1 · Beziehungsmarketing",color:"#5a6ea8"},
  ueb:{label:"K1 · Übersicht",color:"#b0424a"},
  k2plan:{label:"K2 · Planung & Prozess",color:"#1a8fc9"}, k2anal:{label:"K2 · Analyse & Prognose",color:"#0c5c86"},
  k2ziel:{label:"K2 · Ziele & Segmentierung",color:"#17a2a2"}, k2inst:{label:"K2 · Analyseinstrumente",color:"#2f7d9e"},
  k2strat:{label:"K2 · Marktbearbeitung",color:"#5a6ea8"},
  k3prod:{label:"K3 · Produkt-Grundlagen",color:"#4c9a53"}, k3inno:{label:"K3 · Innovation",color:"#2f8f5b"},
  k3etab:{label:"K3 · Etablierte Produkte",color:"#6f9e3f"}, k3mark:{label:"K3 · Markenpolitik",color:"#3d8168"},
  k3sort:{label:"K3 · Verpackung & Sortiment",color:"#8a8b3a"},
  k4grund:{label:"K4 · Preis-Grundlagen",color:"#d98a3a"}, k4strat:{label:"K4 · Preisstrategien",color:"#c56a3a"},
  k4meth:{label:"K4 · Preisfestlegung",color:"#b8862f"}, k4marg:{label:"K4 · Marginalanalyse",color:"#a85a2f"},
  k5grund:{label:"K5 · Grundlagen",color:"#1a8fc9"}, k5plan:{label:"K5 · Planung",color:"#2f7d9e"},
  k5inst:{label:"K5 · Instrumente",color:"#5a6ea8"}, k5budg:{label:"K5 · Werbebudget",color:"#7a5aa0"},
  k5wirk:{label:"K5 · Wirkung & IMK",color:"#9a5a86"},
  k6grund:{label:"K6 · Grundlagen",color:"#4c9a53"}, k6beurt:{label:"K6 · Betriebstypen",color:"#3d8168"},
  k6kontr:{label:"K6 · Kontrakte & Vertrieb",color:"#6f9e3f"}, k6log:{label:"K6 · Logistik",color:"#2f8f5b"},
  exnach:{label:"Exkurs · Nachhaltigkeit",color:"#159c74"},
};
const CAT2KAP = {
  begr:"kap1",entw:"kap1",digi:"kap1",konz:"kap1",mix:"kap1",bez:"kap1",ueb:"kap1",
  k2plan:"kap2",k2anal:"kap2",k2ziel:"kap2",k2inst:"kap2",k2strat:"kap2",
  k3prod:"kap3",k3inno:"kap3",k3etab:"kap3",k3mark:"kap3",k3sort:"kap3",
  k4grund:"kap4",k4strat:"kap4",k4meth:"kap4",k4marg:"kap4",
  k5grund:"kap5",k5plan:"kap5",k5inst:"kap5",k5budg:"kap5",k5wirk:"kap5",
  k6grund:"kap6",k6beurt:"kap6",k6kontr:"kap6",k6log:"kap6",
  exnach:"exkurs",
};

const CARDS = [{c:"begr", q:"Nenne die zentrale Arbeitsdefinition von Marketing (nach Decker et al.).",
   a:"Marketing = <b>Analyse, Planung und Gestaltung</b> der zwischen einem Unternehmen und seinen Kunden stattfindenden <b>Austauschprozesse</b> zum <b>Aufbau und zur Pflege</b> einer für <b>beide Seiten vorteilhaften Kundenbeziehung</b>."},
  {c:"begr", q:"Erkläre das einfache Anbieter-Nachfrager-Modell als Ausgangspunkt.",
   a:"<b>Nachfrager</b> (Bedürfnisse) und <b>Anbieter</b> (Leistungen) stehen im Austausch. Es fließen: <b>Informationen</b> (beidseitig), <b>Leistungen</b> (Anbieter→Nachfrager) und <b>Entgelt</b> (Nachfrager→Anbieter). Ergebnis: Bedürfnisbefriedigung/Kundennutzen ↔ Umsatz/Gewinn/Anbieternutzen. Leitfrage: „Passt das noch?“"},
  {c:"begr", q:"Welche zwei Prinzipien erklären, warum ein Austausch zwischen Marktpartnern zustande kommt?",
   a:"<b>Gratifikationsprinzip:</b> Welche <b>Anreize</b> bestehen für die Marktpartner? (Nutzen/Gegenleistung). <b>Kapazitätsprinzip:</b> Welche <b>Ressourcen</b> benötigen die Marktpartner? (z. B. Einkommen, Zeit, Information bzw. Produktionsprozesse, Mitarbeiter, finanzielle Mittel)."},
  {c:"begr", q:"Was ist Marketing Intelligence?",
   a:"<b>Sammlung und Analyse von Daten</b> über <b>Produkte, Kunden und Wettbewerber</b> zur <b>Unterstützung und Absicherung</b> von Marketingentscheidungen."},
  {c:"begr", q:"Was ist das übergeordnete Ziel modernen Marketings aus Erlebnissicht?",
   a:"<b>Ganzheitlich positive Kundenerlebnisse</b> als Reaktion der Kunden auf <b>Kontakte</b> mit dem Unternehmen und dessen Produkten oder Dienstleistungen."},
  {c:"begr", q:"Kundennutzen vs. Produktnutzen — worum geht es?",
   a:"Marketing verkauft <b>Kundennutzen und Problemlösungen</b>, nicht bloß Produkteigenschaften. Entscheidend ist der <b>wahrgenommene Nutzen aus Kundensicht</b>, nicht die reine (technische) Produktleistung."},
  {c:"begr", q:"„Marketing ist …“ — nenne die 5 grundsätzlichen Kernaussagen.",
   a:"Marketing … (1) ist <b>mehr</b> als Bewerbung und Verkauf; (2) bedeutet bewusst <b>marktorientierte Unternehmensführung</b>; (3) heißt, <b>Kundennutzen und Problemlösungen</b> zu verkaufen; (4) heißt <b>nicht</b>, es jedem recht zu machen → <b>Konzentration auf Zielgruppen</b>; (5) zielt nicht nur auf kurzfristige Umsatz-/Gewinnmaximierung, sondern primär auf die <b>langfristige Unternehmenssicherung</b>."},

  // ---- Entwicklung ----
  {c:"entw", q:"Skizziere die historische Entstehung des Marketingbegriffs.",
   a:"Grundidee seit <b>Jahrhunderten</b> im Marktgeschehen. Begriff „Marketing“ entsteht zu <b>Beginn des 20. Jh.</b> im angloamerikanischen Raum (→ „<b>to market</b>“). Ausgangspunkt: <b>Marketing ≙ Verkauf</b> (Produkte „absetzen“), anfangs eher nachrangige Funktion. In den <b>1920ern</b> um den Aspekt <b>Werbung</b> ergänzt, danach kontinuierlich erweitert."},
  {c:"entw", q:"Nenne die Entwicklungsstufen des Marketings (inhaltlicher Fokus über die Zeit).",
   a:"<b>Distributions-</b> → <b>Verbraucher-</b> → <b>Handels-</b> → <b>Wettbewerbs-</b> → <b>Umwelt-</b> → <b>Netzwerk-</b> → <b>Digitale Wertschöpfungsorientierung</b>. Parallel wandelt sich das Anspruchsspektrum: Distributionsfunktion → dominante Engpassfunktion → Führungsfunktion → strategisches/marktorientiertes → individuelles/vernetztes Beziehungsmarketing → Digitales Marketing."},
  {c:"entw", q:"Wie hat sich der Marketingbegriff in den offiziellen Definitionen gewandelt (AMA 1948 → heute)?",
   a:"<b>1948 (AMA):</b> Fokus auf den Prozess des Absetzens (planning/executing: conception, pricing, promotion, distribution). <b>1967 (Kotler):</b> Managementorientierung — Bedürfnisse/Wünsche/Werte des Zielmarkts besser als Wettbewerber befriedigen. <b>2004 (AMA) & 2015 (Kotler):</b> Fokus auf <b>Wertschaffung (value)</b> und Management von <b>Kundenbeziehungen</b>. <b>2024 (UMD):</b> Wert für Kunden, Partner <b>und die Gesellschaft</b> insgesamt."},

  // ---- Digital & heute ----
  {c:"digi", q:"Was ist Digital Marketing (3 Kernaussagen)?",
   a:"(1) Erreichen von Marketingzielen durch <b>digitale Technologien/Medien</b> zur Schaffung von <b>Customer Experience</b>; (2) erfordert effektives <b>Customer-Journey-Management</b> für konsistente, kontextsensitive Markenkommunikation über alle <b>Touchpoints</b>; (3) ist <b>Ergänzung (complement), nicht Ersatz</b> des traditionellen Marketings."},
  {c:"digi", q:"Was ist Multichannel Marketing?",
   a:"Erreichen von Marketingzielen durch Integration von Kommunikation und Distribution über die <b>Kombination digitaler UND traditioneller Plattformen</b> an verschiedenen Touchpoints der Customer Journey. Unterstützt <b>„mixed-mode buying“</b> (Mischung verschiedener Kommunikations-/Kaufwege)."},
  {c:"digi", q:"Unterscheide Digital Outbound, Digital Inbound und Social Media Marketing.",
   a:"<b>Digital Outbound:</b> Unternehmen → Kunde (aktive Ansprache). <b>Digital Inbound:</b> Kunde → Unternehmen (Kunde findet/kontaktiert das Unternehmen). <b>Social Media Marketing:</b> bidirektionaler Austausch zwischen Unternehmen und Kunde über soziale Medien."},
  {c:"digi", q:"Nenne die 5 Phasen des Gartner Hype Cycle (for Digital Marketing).",
   a:"1. <b>Innovation Trigger</b> → 2. <b>Peak of Inflated Expectations</b> → 3. <b>Trough of Disillusionment</b> → 4. <b>Slope of Enlightenment</b> → 5. <b>Plateau of Productivity</b>. Achse: Expectations über Time — zeigt überzogene Erwartungen und die spätere realistische Etablierung von Technologien."},
  {c:"digi", q:"Kotler 5A-Modell des Customer Path („traditionell“ und „digital“).",
   a:"<b>Aware → Appeal → Ask → Act → Advocate.</b> Digital Marketing greift zunehmend über den gesamten Pfad ein; das Markenengagement steigt über die Ebenen <b>E1 Enjoyment → E2 Experience → E3 Engagement</b>."},
  {c:"digi", q:"Nenne die 4 „Intelligence“-Arten aus der Nutzung digitaler Daten + gemeinsames Ziel.",
   a:"<b>Algorithmic Intelligence</b> (automatisierte Datenerhebung/-verarbeitung, z. B. Empfehlungen bei Netflix/Amazon); <b>Business Intelligence</b> (Analyse interner Rohdaten für Managemententscheidungen, z. B. SAP BusinessObjects); <b>Customer Intelligence</b> (aus Kundendaten für bessere Kundenbeziehungen, z. B. Zendesk); <b>Market Intelligence</b> (aus Marktdaten für Strategien, z. B. SimilarWeb). <b>Ziel:</b> datengetriebene Marketingentscheidungen in <b>Echtzeit</b>."},
  {c:"digi", q:"Welche 5 Kategorien aktueller Herausforderungen/Trends wirken auf das Marketing?",
   a:"<b>Sozio-kulturelle</b>, <b>politisch-rechtliche</b>, <b>ökonomische</b>, <b>ökologische</b> und <b>technologische</b> Herausforderungen — mit dem <b>Kunden</b> (bzw. Kunde/Wettbewerb/Unternehmen) im Zentrum."},
  {c:"digi", q:"„Hype oder Trend?“ — nenne beispielhafte aktuelle Marketing-Schlagworte.",
   a:"Best-Ager-Marketing, <b>Green Marketing</b> (vs. Greenwashing), Internet-/Mobile Marketing, <b>Digital & Influencer Marketing</b>, Sustainable Marketing, Multichannel Marketing, Metaverse Marketing, <b>Hyper-Personalized Marketing</b>."},

  // ---- Konzepte & Modelle ----
  {c:"konz", q:"Erkläre das „Strategische Dreieck“ des Marketings.",
   a:"Drei Eckpunkte: <b>eigenes Leistungsangebot</b> (Unternehmen), <b>Bedürfnisse/Wünsche der Kunden</b> und <b>Leistungsangebot der Wettbewerber</b>; in der Mitte: <b>Unsicherheit</b>. Der Kunde beurteilt das <b>Preis-Leistungs-Verhältnis</b> (Kundennutzen); ggü. Wettbewerbern zählt <b>Differenzierung/Wettbewerbsvorteil</b>."},
  {c:"konz", q:"Ziel und Ausgangspunkt im Strategischen Dreieck?",
   a:"<b>Ziel:</b> Schaffung und Erhalt <b>nachhaltiger Wettbewerbsvorteile</b> durch Leistungsdimensionen, die (1) <b>dauerhaft</b>, (2) für Kunden <b>substanziell</b> und (3) <b>wahrnehmbar überlegen</b> sind. <b>Ausgangspunkt:</b> systematische Analyse der unternehmensspezifischen Ressourcen/Kompetenzen sowie der marktseitigen Rahmenbedingungen."},
  {c:"konz", q:"Wie lautet die „Erfolgskette des Marketings“?",
   a:"<b>Marketingaktivitäten → Kundengewinnung → Kundenzufriedenheit → Kundenbindung → Ökonomischer Erfolg.</b> (Die Variante „Vom Kundennutzen zum ökonomischen Erfolg“ startet mit dem <b>wahrnehmbaren Kundennutzen</b>.)"},
  {c:"konz", q:"Welche Faktoren moderieren die Erfolgskette des Marketings?",
   a:"<b>Unternehmensexterne</b> moderierende Faktoren (z. B. Heterogenität der Kundenbewertungen, Marktdynamik/-komplexität, „Variety-Seeking“, Image, Preisbereitschaft, Kundenfluktuation) und <b>unternehmensinterne</b> moderierende Faktoren (z. B. Individualität/Komplexität der Leistung, technologische Leistungsfähigkeit, digitale Präsenz, Wechselbarrieren, Verfügbarkeit von Kundendaten, Mitarbeiterfluktuation)."},
  {c:"konz", q:"Was ist H2H-Marketing und worauf basiert es?",
   a:"<b>Human-to-Human:</b> menschzentrierter, ganzheitlicher Ansatz, der Kunden und Mitarbeitende als handelnde/fühlende Individuen <b>auf Augenhöhe</b> begreift; Ausrichtung auf <b>empathische, vertrauensvolle Beziehungen</b> jenseits von Zielgruppen/Kanälen/Transaktionen. Basiert auf 3 Säulen — <b>Design Thinking, Service-Dominant Logic, Digitalization</b> — auf 3 Ebenen: <b>Mindset</b> (normativ), <b>Management</b> (strategisch), <b>Process</b> (operativ)."},
  {c:"konz", q:"Definiere die Customer Journey und nenne ihre drei Phasen.",
   a:"<b>„Kundenreise“</b> = Weg, den ein Kunde zusammen mit einem Unternehmen während des <b>Kaufzyklus</b> über mehrere <b>Berührungspunkte (Touchpoints)</b> hinweg zurücklegt. Phasen: <b>Vor-Kauf</b> (Bedarfserkennung – Konkretisierung – Suche), <b>Kauf</b> (Auswahl – Bestellung – Bezahlung), <b>Nach-Kauf</b> (Ge-/Verbrauch – Bindung – Engagement)."},
  {c:"konz", q:"Nenne die 5 Stufen der Customer Journey (Berührungspunkt-Sicht).",
   a:"<b>Bewusstsein → Suche → Kauf → Erfahrung → Fürsprache.</b> (Entspricht grob Awareness → Search → Purchase → Experience → Advocacy.)"},

  // ---- Marketing-Mix ----
  {c:"mix", q:"Was ist der Marketing-Mix und wonach wird er systematisiert?",
   a:"Marketing-Mix = <b>Gesamtheit der eingesetzten Marketing-Instrumente</b>. Systematisierung nach den <b>4 P's von McCarthy (1960)</b>: Product, Price, Promotion, Place."},
  {c:"mix", q:"Nenne die 4 P's mit deutscher Entsprechung und je einer Kurzdefinition.",
   a:"<b>Product (Produktpolitik):</b> alle Entscheidungen zur Gestaltung des <b>Leistungsprogramms</b>. <b>Price (Preispolitik):</b> legt die <b>Konditionen</b> fest, zu denen Leistungen angeboten werden. <b>Promotion (Kommunikationspolitik):</b> alle Maßnahmen der <b>Kommunikation</b> mit (potenziellen) Kunden, Mitarbeitenden und Bezugsgruppen. <b>Place (Vertriebspolitik):</b> alle Maßnahmen, damit der Kunde die Leistung beziehen kann — <b>Überbrückung von Raum und Zeit</b> zwischen Herstellung und Kauf."},
  {c:"mix", q:"Produktpolitik: nenne Instrumente i. e. S. und i. w. S.",
   a:"<b>i. e. S.:</b> Produktinnovation, Produktverbesserung/-variation, Produktdifferenzierung, Produkteliminierung. <b>i. w. S.:</b> Markierung, Namensgebung, Serviceleistungen, Sortimentsplanung, Verpackung."},
  {c:"mix", q:"Preispolitik: nenne typische Instrumente.",
   a:"Preis, Rabatte, Boni und Skonti, Lieferbedingungen, Zahlungsbedingungen."},
  {c:"mix", q:"Kommunikationspolitik: nenne typische Instrumente.",
   a:"Mediawerbung, Verkaufsförderung, Direct Marketing, Public Relations, Sponsoring, Persönliche Kommunikation, Messen und Ausstellungen, Event-Marketing, Social-Media-Marketing, VR-/AR-Kommunikation, Metaverse Communication, Hyper-Personalisierung."},
  {c:"mix", q:"Vertriebspolitik: nenne typische Instrumente.",
   a:"Vertriebssysteme, Verkaufsorgane, Logistiksysteme, Multichanneling."},
  {c:"mix", q:"Wozu werden die Teilmixe (Produkt-, Preis-, Kommunikations-, Vertriebsmix) zusammengeführt?",
   a:"Sie bilden zusammen den <b>Marketing-Mix</b>, der auf <b>Teilmärkte und Kundengruppen</b> ausgerichtet wird — unter Beachtung <b>limitierender Faktoren</b>."},

  // ---- Beziehungsmarketing ----
  {c:"bez", q:"Was sind die „3 R“ der Marketinginstrumente und ihr jeweiliger Fokus?",
   a:"<b>Recruitment</b> — Kundenakquisition, Fokus <b>Kundendialog</b>. <b>Retention</b> — Kundenbindung, Fokus <b>Kundenzufriedenheit</b>. <b>Recovery</b> — Kundenrückgewinnung, Fokus <b>Wechselbarrieren</b>. Sie ergänzen die 4 P's um die Beziehungsdimension."},
  {c:"bez", q:"Transaktions- (4 P) vs. Beziehungsmarketing (3 R): grundlegender Perspektivwechsel?",
   a:"Wechsel von der <b>„Inside-Out-Perspektive“</b> (Leistung des Unternehmens nach außen) zur <b>„Outside-In-Perspektive“</b> (vom Kunden/Markt her denken)."},
  {c:"bez", q:"Vergleiche Transaktions- vs. Beziehungsmarketing (5 Merkmale).",
   a:"<b>Fristigkeit:</b> kurz- vs. langfristig. <b>Marketingobjekt:</b> Produkt vs. Produkt <b>und Interaktion</b>. <b>Marketingziel:</b> beide Akquisition/Bindung/Rückgewinnung. <b>Strategie:</b> Leistungsdarstellung vs. <b>Dialog</b> (→ Dialogmarketing). <b>Erfolgs-/Steuerungsgrößen:</b> Absatz, Umsatz, Deckungsbeitrag, Gewinn, Kosten — beim Beziehungsmarketing <b>zusätzlich Kundendeckungsbeitrag und Kundenwert</b>."},

  // ---- Übersicht ----
  {c:"ueb", q:"Was sind die Lernziele von Kapitel 1?",
   a:"Nach Kapitel 1 kannst du: den <b>Marketingbegriff</b> inhaltlich skizzieren; die <b>historische Entwicklung</b> nachvollziehen; <b>aktuelle (digitale) Entwicklungen</b> erkennen; zentrale <b>Handlungsfelder</b> benennen; die Notwendigkeit der <b>Kundenorientierung</b> verstehen; <b>Basiskonzepte</b> benennen/abgrenzen und Gefahren beschreiben; den <b>relevanten Markt</b> abgrenzen; Marketing als <b>Managementprozess</b> skizzieren."},
  {c:"ueb", q:"Gliederung der Vorlesung „Grundlagen des Marketings“?",
   a:"<b>Kap. 1</b> Gegenstand & Grundbegriffe · <b>Kap. 2</b> Marketingplanung & -strategie · <b>Kap. 3</b> Produktpolitik · <b>Kap. 4</b> Preispolitik · <b>Kap. 5</b> Kommunikationspolitik · <b>Kap. 6</b> Vertriebspolitik · <b>Exkurs:</b> Nachhaltigkeit im Marketing."},
  {c:"ueb", q:"Welche Kapitel-1-Themen tauchen in den Klausur-Beispielaufgaben auf?",
   a:"Aus Kap. 1: <b>Bedeutung des digitalen Marketings</b> + damit verbundene <b>Herausforderungen</b>; Konzept der <b>Customer Journey</b> erklären/begründen + typische <b>Touch Points</b> nennen. (Weitere Beispielaufgaben betreffen spätere Kapitel: Confirmation-Disconfirmation-Paradigma, Markenallianz, Einzelhandelsfunktionen, ADBUDG-Modell.)"},

  // ===== KAPITEL 2 – Planung & Prozess =====
  {c:"k2plan", q:"Lernziele Kapitel 2 — was solltest du können?",
   a:"Den <b>Marketingplan</b> als Kernelement des Managementprozesses skizzieren; Instrumente zur <b>Analyse der Marketingsituation</b> benennen; <b>Prognoseverfahren</b> (qualitativ/quantitativ) abgrenzen; das <b>Zielsystem</b> und die Hierarchisierung von Zielen verstehen; <b>Segmentierungskriterien</b> + Beispiele benennen; <b>strategische Analyseinstrumente</b> verstehen/anwenden; <b>Marktbearbeitungsstrategien</b> abgrenzen."},
  {c:"k2plan", q:"Nenne die drei Zeithorizonte der (Unternehmens-)Planung.",
   a:"<b>Operative Planung</b> (kurzfristig, unterjährig): gegenwärtige Situation, kurzfristige Ziele, Aktionen, Budgets, Steuerung für das laufende Jahr. <b>Mittelfristige Planung</b>: wesentliche Kräfte der nächsten Jahre, mittel-/langfristige Ziele, Strategien, Ressourcen. <b>Strategische Planung</b>: Nutzung neu entstehender Möglichkeiten in sich ändernder Umwelt — Übereinstimmung von Zielen/Ressourcen mit Marktchancen."},
  {c:"k2plan", q:"Wie läuft Marketing als Managementprozess ab?",
   a:"<b>Analyse → Planung → Durchführung → Kontrolle.</b> Der <b>Marketingplan</b> ist das Kernstück des Prozesses und Ausdruck entscheidungsorientierten Verhaltens; Marketing verlangt systematische, zunehmend <b>datenbasierte</b> Entscheidungsfindung."},
  {c:"k2plan", q:"Nenne die 5 Anforderungen an den Marketingplan.",
   a:"(1) <b>Zeitlich</b> — Frühzeitigkeit, revolvierender Prozess. (2) <b>Inhaltlich</b> — Vollständigkeit. (3) <b>Konzeptionell</b> — Maß an Flexibilität. (4) <b>Formal</b> — schriftliche Fixierung. (5) <b>Organisatorisch</b> — klare Verantwortlichkeiten und Aufgabenbereiche."},
  {c:"k2plan", q:"Grobstruktur eines Marketingplans — die 8 Bausteine?",
   a:"(1) Relevanter Markt/Leistung · (2) Marketingsituation (Chancen/Risiken, Stärken/Schwächen) · (3) Marktsegmente · (4) Marketingziele · (5) Marketingstrategie · (6) Marketingmaßnahmen (Marketing-Mix) · (7) Marketingbudget · (8) Implementierung und Kontrolle."},

  // ===== KAPITEL 2 – Analyse & Prognose =====
  {c:"k2anal", q:"Was umfasst die Analyse der Marketingsituation?",
   a:"Ausgangspunkt jeder Marketingplanung. Zwei Stoßrichtungen: <b>Chancen-Risiken-Analyse</b> (extern) und <b>Stärken-Schwächen-Analyse</b> (intern). Relevante Faktoren: <b>Markt-, Konkurrenz-, Lieferanten-, Handels-, Kunden-, Umfeld-</b> und <b>Unternehmenssituation</b>."},
  {c:"k2anal", q:"Erkläre die SWOT-Analyse.",
   a:"Verknüpft <b>interne</b> Stärken/Schwächen (Strengths/Weaknesses) mit <b>externen</b> Chancen/Risiken (Opportunities/Threats) in einer <b>SWOT-Matrix</b>. Basis: <b>Strategie-Audit</b> (systematische Bestandsaufnahme). Verdichtet viele Infos auf wenige <b>Erfolgsfaktoren</b> → Definition der zentralen Marketingproblemstellung."},
  {c:"k2anal", q:"Nenne die 5 Kräfte der Branchenstrukturanalyse (Porter).",
   a:"Im Zentrum: <b>Rivalität</b> zwischen Unternehmen der Branche. Dazu: <b>Verhandlungsstärke der Abnehmer</b>, <b>Verhandlungsstärke der Lieferanten</b>, <b>Bedrohung durch neue Konkurrenten</b> (Markteintrittsbarrieren, z. B. Economies of Scale, Kapitalbedarf) und <b>Bedrohung durch Ersatzprodukte</b> (Substitute)."},
  {c:"k2anal", q:"Was ist eine Prognose und wie geht man vor (6 Schritte)?",
   a:"<b>Prognose</b> = Aussagen über zukünftige Ereignisse (auf Basis realer Beobachtungen und/oder theoretischer Überlegungen). Schritte: (1) Prognosegegenstand identifizieren · (2) Erklärungsmodell formulieren · (3) Zeitstabilitätshypothese prüfen · (4) historische „Ankerdaten“ bestimmen · (5) Prognoseverfahren anwenden · (6) Ergebnisse kritisch beurteilen."},
  {c:"k2anal", q:"Unterscheide qualitative und quantitative Prognoseverfahren.",
   a:"<b>Quantitativ:</b> Entwicklungsprognosen und Wirkungsprognosen (datenbasiert). <b>Qualitativ:</b> Expertenbefragungen, Delphi-Technik, Szenario-Technik, Morphologie."},
  {c:"k2anal", q:"Wie funktioniert die Delphi-Technik?",
   a:"Prognose durch einen <b>Kreis von Experten</b> (mündlich/schriftlich, z. B. zu Marktentwicklungen). Besonderheit: <b>anonymer Abgleich</b> der Prognosen mit Möglichkeit zur Anpassung der eigenen Einschätzung; meist <b>2–3 Durchgänge</b>."},
  {c:"k2anal", q:"Was ist die Szenario-Technik?",
   a:"Entwicklung alternativer Zukunftsbilder in einem „Trichter“: ein <b>positives</b> und ein <b>negatives Extremszenario</b> sowie ggf. ein <b>Trendszenario</b>. Berücksichtigt <b>Störereignisse</b> und Entscheidungspunkte. Problem: Kausalzusammenhang zwischen Umweltentwicklungen und Handlungsoptionen."},
  {c:"k2anal", q:"Konzept der „schwachen Signale“ (Ansoff 1976)?",
   a:"Unstrukturierte, unpräzise Informationen, die noch mehrere Deutungen zulassen, bei deren Empfang aber schon über strategische Handlungsalternativen nachgedacht werden sollte. Merkmale: <b>vorausschauend, qualitativ, mehrdeutig, lückenhaft</b>, aus verschiedenen Quellen. Frühes Erkennen ist wichtig, aber schwierig."},
  {c:"k2anal", q:"Frühwarnsysteme: Zweck und 4 Entwicklungsstufen?",
   a:"Dienen der systematischen <b>Antizipation von Umweltveränderungen</b>, um Chancen/Risiken früh zu erkennen. Stufen: (1) <b>Kennzahlensysteme</b> (Problem: vergangenheitsorientiert, z. B. Du-Pont) → (2) <b>Indikatorensysteme</b> → (3) <b>Strategische Systeme</b> (schwache Signale) → (4) <b>Vernetzte Systeme</b> (Komplexität der Wirkungsketten)."},

  // ===== KAPITEL 2 – Ziele & Segmentierung =====
  {c:"k2ziel", q:"Wie ist die Zielhierarchie im Marketing aufgebaut?",
   a:"(1) <b>Unternehmensziele</b> (Goals) → (2) <b>Marketingziele</b> → (3) evtl. <b>Zwischenziele</b> → (4) <b>Marketing-Mix</b>. Marketingziele determinieren angestrebte künftige Sollzustände, die über Strategien und Instrumenteneinsatz erreicht werden sollen."},
  {c:"k2ziel", q:"Ökonomische vs. psychologische Marketingziele — je Beispiele.",
   a:"<b>Ökonomisch:</b> Umsatz/Absatz, Marktanteil, Deckungsbeitrag, Gewinn, Rendite. <b>Psychologisch:</b> Bekanntheitsgrad, Image/Einstellung, Kundenzufriedenheit, Kaufpräferenzen, Kundenbindung."},
  {c:"k2ziel", q:"Nenne die 5 Dimensionen zur Operationalisierung von Marketingzielen.",
   a:"<b>Zielinhalt</b> (Was?), <b>Zielausmaß</b> (Wie viel?), <b>Zielperiode</b> (Bis wann?), <b>Zielsegment</b> (In welchem Segment?), <b>Zielgebiet</b> (In welchem Gebiet?). Beispiel: Umsatz von SCHMERZFREI in 12 Monaten um 10 % ggü. Vorjahr im Gebiet Nord steigern."},
  {c:"k2ziel", q:"Was ist eine strategische Geschäftseinheit (SGE)?",
   a:"Operativ <b>unabhängige Planungseinheit</b> eines Unternehmens, die abgegrenzte, heterogene Tätigkeitsfelder repräsentiert und eigenständige (Markt-)Aufgaben erfüllt. SGEs sollen eigenständig, von Konkurrenz abgehoben, marktbedeutend und <b>in sich homogen, untereinander heterogen</b> sein. Sie ist die strategisch relevante Planungseinheit (statt des Gesamtunternehmens)."},
  {c:"k2ziel", q:"Wie spezifiziert man eine SGE nach Abell (1980)?",
   a:"Über drei Dimensionen: <b>Abnehmergruppen</b> (Wer wird bedient?), <b>Abnehmerfunktionen/Bedürfnisse</b> (Welche Bedürfnisse werden befriedigt?) und <b>Technologien</b> (Womit / auf welche Weise?)."},
  {c:"k2ziel", q:"Was ist Marktsegmentierung und welche Anforderungen gelten?",
   a:"<b>Definition:</b> Aufspaltung eines heterogenen Marktes in homogene Teilmärkte (Segmente) anhand von Käufermerkmalen. <b>Anforderungen:</b> Kaufverhaltensrelevanz, Messbarkeit (Operationalität), Erreichbarkeit/Zugänglichkeit, Handlungsfähigkeit, Wirtschaftlichkeit, zeitliche Stabilität."},
  {c:"k2ziel", q:"Nenne die 4 Kriteriengruppen der Marktsegmentierung.",
   a:"<b>Geographisch</b>, <b>soziodemographisch</b>, <b>psychographisch</b> (z. B. Lebensstil, Einstellungen) und <b>verhaltensorientiert</b>. Beispiel Lebensstil: Sinus-Milieus über <b>Grundorientierung × soziale Lage</b> — „soziodemografische Zwillinge“ zeigen: gleiche Demografie ≠ gleiche Zielgruppe."},

  // ===== KAPITEL 2 – Analyseinstrumente =====
  {c:"k2inst", q:"Wie werden strategische Analyseinstrumente eingeteilt?",
   a:"<b>Externe Analyse (Marktanalysen):</b> ökonomisch (Lebenszyklus-, Portfolio-, Benchmarking-, Erfolgsfaktorenanalyse) und psychologisch (Image-, Positionierungs-, Means-End-Analyse). <b>Interne Analyse (Unternehmensanalysen):</b> ex post (Wertketten-, Struktur-, Sortiments-, Kundenportfolioanalyse) und ex ante (Erfahrungskurve, Gap-Analyse, Wettbewerbsanalyse, PIMS, Balanced Scorecard)."},
  {c:"k2inst", q:"Was leistet eine Lebenszyklusanalyse?",
   a:"Setzt sich mit den <b>Lebenszyklusphasen</b> auseinander, identifiziert Gesetzmäßigkeiten und ordnet das Analyseobjekt in den Zyklus ein, um daraus Schlussfolgerungen für die <b>Marktbearbeitungsstrategie</b> zu ziehen (z. B. Einführung, Wachstum, Reife, Sättigung, Degeneration)."},
  {c:"k2inst", q:"Was ist eine Portfolioanalyse (Definition + Ablauf)?",
   a:"<b>Zweidimensionale</b> Darstellung der Marktsituation von SGEs/Produkten/Kunden etc., um <b>Normstrategien</b> abzuleiten. Ablauf: (1) Analyseobjekte/Portfolioform festlegen · (2) Ist-Portfolio erstellen · (3) Soll-Positionen bestimmen · (4) Normstrategien ableiten/prüfen · (5) durch detaillierte Marketingstrategien konkretisieren."},
  {c:"k2inst", q:"BCG-Portfolio (MMP): Achsen, Felder, Normstrategien?",
   a:"<b>Marktanteils-Marktwachstums-Portfolio</b> (Boston Consulting Group). Achsen: <b>Marktwachstum</b> (y) × <b>relativer Marktanteil</b> (x). Felder: <b>Question Marks</b> (Nachwuchs), <b>Stars</b> (investieren), <b>Cash Cows</b> (abschöpfen), <b>Poor Dogs</b> (desinvestieren)."},
  {c:"k2inst", q:"McKinsey-Portfolio (WMP): Achsen und Zonen?",
   a:"<b>Wettbewerbsvorteils-Marktattraktivitäts-Portfolio</b> (McKinsey). 3×3-Matrix: <b>Marktattraktivität × Wettbewerbsstärke</b>. Zonen: <b>Investitions-/Wachstumsstrategien</b> (oben rechts), <b>Selektions-/Übergangsstrategien</b> (Diagonale), <b>Abschöpfungs-/Desinvestitionsstrategien</b> (unten links)."},
  {c:"k2inst", q:"Was ist Benchmarking?",
   a:"Teil der Konkurrenzanalyse: systematischer <b>Vergleich der eigenen Leistung mit führenden Referenzunternehmen</b> („Best Practice“), um Leistungslücken und deren Gründe zu erkennen. Ziel: bessere, schnellere, günstigere Umsetzung. Arten: <b>Prozess-, Performance-</b> und <b>Strategie-Benchmarking</b>."},
  {c:"k2inst", q:"Was ist eine Positionierungsanalyse?",
   a:"Stellt in einer <b>mehrdimensionalen Darstellung</b> die Leistungen/Marken eines Marktes in der <b>Wahrnehmung der Kunden</b> dar („psychologisches Marktmodell“, Perceptual Mapping). Elemente: wahrgenommener Eigenschaftsraum, Real- und Konkurrenzpositionen, <b>Idealposition(en)</b> (Idealpunktmodelle) und Distanzen dazu."},
  {c:"k2inst", q:"Erkläre das Erfahrungskurvengesetz.",
   a:"„Mit jeder <b>Verdopplung der kumulierten Menge</b> besteht ein <b>Stückkostensenkungspotenzial von 20–30 %</b>“ (inflationsbereinigt). Keine gesetzmäßige, sondern <b>erreichbare</b> Senkung — durch Lerneffekte, Produkt-/Verfahrensinnovationen. Abzugrenzen von (Dis-)Economies of Scale und Rationalisierungseffekten."},
  {c:"k2inst", q:"Wozu nutzt man Erfahrungskurvenanalysen?",
   a:"Zur mittel-/langfristigen Prognose von <b>Kosten-, Preis- und Gewinnentwicklung</b>, zur Abschätzung der Kosten-/Gewinnwirkung von Marktanteilsänderungen, zur Einschätzung des <b>preispolitischen Spielraums der Konkurrenz</b> und zur Fundierung von <b>Make-or-Buy-Entscheidungen</b>."},
  {c:"k2inst", q:"Was ist die Balanced Scorecard (Kaplan/Norton)?",
   a:"Ein <b>ausgewogenes Kennzahlensystem</b> zur ganzheitlichen Bewertung, Messung, Dokumentation und <b>Steuerung</b> der Aktivitäten im Hinblick auf Vision und Strategie. Management-Instrument zur konsequenten Ausrichtung aller Aktionen auf ein gemeinsames Ziel."},

  // ===== KAPITEL 2 – Marktbearbeitung =====
  {c:"k2strat", q:"Nenne die 4 Typen von Marktteilnehmerstrategien.",
   a:"(1) <b>Abnehmergerichtete</b>, (2) <b>konkurrenzgerichtete</b>, (3) <b>absatzmittlergerichtete</b> Strategien und (4) <b>Instrumentalstrategien</b> (Ausgestaltung der Marketinginstrumente)."},
  {c:"k2strat", q:"Abnehmergerichtete Strategien — welche Ausprägungen?",
   a:"Langfristiger Verhaltensplan, der über Wettbewerbsvorteile das Kundenverhalten beeinflusst: <b>Qualitätsführerschaft</b>, <b>Kostenführerschaft</b> sowie jeweils die <b>selektive</b> Qualitäts- bzw. Kostenführerschaft."},
  {c:"k2strat", q:"Konkurrenz- und absatzmittlergerichtete Strategien?",
   a:"<b>Konkurrenzgerichtet</b> (Abgrenzung ggü. Wettbewerbern): Konflikt-, Kooperations-, Ausweich- und Anpassungsstrategie. <b>Absatzmittlergerichtet</b> (Position bei Vertriebspartnern stärken): Konflikt-, Umgehungs-, Kooperations- und Anpassungsstrategie."},
  {c:"k2strat", q:"Was sind Instrumentalstrategien?",
   a:"Grundsätzliche Entscheidungen über die Ausgestaltung der Marketinginstrumente: <b>Produktstrategie, Preisstrategie, Kommunikationsstrategie, Vertriebsstrategie.</b>"},

  // ===== KAPITEL 3 – Produkt-Grundlagen =====
  {c:"k3prod", q:"Lernziele Kapitel 3 — was solltest du können?",
   a:"Zentrale <b>Produktkomponenten</b> erläutern; <b>Ziele und Instrumente</b> der Produktpolitik benennen; <b>Ansätze</b> der Produktpolitik abgrenzen; den <b>Neuproduktentwicklungsprozess</b> erklären; <b>Kreativitätstechniken</b> benennen; Elemente der <b>Markenpolitik</b> verstehen; Entscheidungen der <b>Verpackungs-</b> und <b>Sortimentspolitik</b> erläutern."},
  {c:"k3prod", q:"Wie ist „Produkt“ definiert (Decker et al.)?",
   a:"Ein <b>Bündel von Eigenschaften</b>, das seinem Verwender einen <b>wahrnehmbaren Nutzen</b> spendet — es zielt auf die Erzeugung von Kundennutzen jedweder Art. Umfasst materielle Güter, Dienstleistungen, Erlebnisse usw."},
  {c:"k3prod", q:"Nenne die drei Produktverständnisse.",
   a:"<b>Substanziell:</b> Kernprodukt = Bündel physisch-technischer Eigenschaften. <b>Erweitert:</b> Leistungspaket = Befriedigung funktionaler, emotionaler und sozialer Bedürfnisse. <b>Generisch:</b> sämtliche materiellen/immateriellen Facetten, aus denen Kundennutzen resultieren kann."},
  {c:"k3prod", q:"Produktklassen nach Kaufverhalten?",
   a:"<b>Convenience Goods</b> (täglicher Bedarf), <b>Shopping Goods</b> (gehobener Bedarf, Vergleich beim Kauf) und <b>Speciality Goods</b> (Spezialitäten). Weitere Einteilungen: nach Verwendungszweck/-reife, Zahl der Bedarfsträger, Selbstverkäuflichkeit."},
  {c:"k3prod", q:"Kategorisierung nach Beurteilbarkeit der Qualität?",
   a:"<b>Sucheigenschaften</b> (Inspektionsgüter) — vor dem Kauf prüfbar. <b>Erfahrungseigenschaften</b> (Erfahrungsgüter) — erst nach Ge-/Verbrauch beurteilbar. <b>Vertrauenseigenschaften</b> (Vertrauensgüter) — auch nach dem Kauf kaum/nicht beurteilbar."},
  {c:"k3prod", q:"Aus welchen Komponenten besteht ein Produkt (Produktnutzen)?",
   a:"Um den <b>Produktkern</b> (Basis- und Zusatznutzen) legen sich weitere Schichten: <b>Verpackung, Marke &amp; Image, Serviceleistungen, Garantien, Design, Zubehör</b> und <b>Preis</b>. Aus dem Zusammenspiel entsteht eine <b>USP</b>. („Der Kunde will kein Bohrer, sondern das Loch in der Wand.“)"},
  {c:"k3prod", q:"Definiere Produktpolitik und nenne ihre Handlungsfelder.",
   a:"<b>Produktpolitik</b> = sämtliche Entscheidungen zur Gestaltung des <b>Leistungsprogramms</b> (Sach- und Dienstleistungen). Handlungsfelder mit direktem Produktbezug: <b>Produktinnovation</b>, <b>Produktvariation/-differenzierung</b>, <b>Produkteliminierung</b>. Ziele: ökonomisch (marktgerechte Produkte, Erst-/Wiederkauf, Cross-Selling, Marktanteile) und psychografisch (Image, Präferenzen, Bindung)."},
  {c:"k3prod", q:"Idealtypischer Planungsprozess der Produktpolitik?",
   a:"Situationsanalyse des Leistungsprogramms → Festlegung produktpolitischer Ziele → Strategieentwicklung (Qualitäts-, Preis-, Marken-, Sortiments-, Servicestrategie) → Einsatz der Instrumente (i. e. S./i. w. S.) → Budgetierung → <b>Kontrolle</b>; Integration in den Marketing-Mix."},

  // ===== KAPITEL 3 – Innovation =====
  {c:"k3inno", q:"Nenne die 4 Ansätze der Produktpolitik mit Kernidee.",
   a:"<b>Produktinnovation</b> (≠ Erfindung): für Markt/Unternehmen neuartige Produkte. <b>Produktverbesserung:</b> Ursprungsprodukt wird durch verbesserte Variante <b>ersetzt</b>. <b>Produktdifferenzierung:</b> zusätzliche Variante <b>ergänzt</b> das Programm. <b>Produkteliminierung:</b> Herausnahme aus dem Programm."},
  {c:"k3inno", q:"Herausforderungen und Flop-Ursachen bei Innovationen?",
   a:"Hohe <b>Misserfolgswahrscheinlichkeit</b>, hoher <b>Ressourcenaufwand</b> (Dilemma: Ertrag ex post vs. Einsatz ex ante), <b>Widerstände</b> in Organisation/Management, <b>Marktrisiken</b> (Entwicklungs-/Eintrittsrisiko, entgangene Gewinne). Typische Flop-Ursachen: <b>mangelnder Marktbedarf</b> und <b>schlechtes Timing</b>."},
  {c:"k3inno", q:"Prozess der Entwicklung neuer Produkte (Kotler)?",
   a:"Ideensuche → <b>Ideen-Screening</b> → Konzeptentwicklung &amp; -test → Innovationsstrategie → Marketingstrategie → Analyse der Marktfähigkeit (wirtschaftliche Attraktivität) → <b>Produktentwicklung</b> (Prototyp/Pretests) → Testmarkterprobung → <b>Markteinführung</b>."},
  {c:"k3inno", q:"Interne vs. externe Quellen für Produktideen?",
   a:"<b>Intern:</b> Kunden-/Außendienstberichte, Kundenanfragen/-beschwerden, F&E &amp; betriebliches Vorschlagswesen, KI-Ideengeneratoren. <b>Extern:</b> Kunden-/Experten-/Händlerbefragungen, Konkurrenzbeobachtung, Fachzeitschriften, Internet-/Social-Media-Analysen, Patentämter, Forschungsinstitute."},
  {c:"k3inno", q:"Open Innovation und Kreativitätstechniken?",
   a:"<b>Open Innovation:</b> Crowdsourcing, Customer Co-Creation, Lead-User-Analyse. <b>Kreativitätstechniken</b> (nach Arbeitsweise × Auslöser): intuitiv-assoziativ (Brainstorming, Brainwriting 6-3-5, Mind Mapping), intuitiv-konfrontativ (Reizwortanalyse, Synektik), systematisch-abwandelnd (Morphologische Analyse, Checklisten) und systematisch-konfrontativ (Bionik, TILMAG)."},
  {c:"k3inno", q:"Verfahren zur Prüfung von Produktideen?",
   a:"Ziel: <b>Minimierung des Misserfolgsrisikos</b>. Verfahren u. a. <b>Break-Even-Analyse</b>, <b>Punktbewertung/Nutzwertanalyse</b> (vgl. Morphologische Analyse) und <b>Quality Function Deployment (QFD)</b>."},
  {c:"k3inno", q:"Adoption neuer Produkte — Definition und 5 Phasen (Rogers)?",
   a:"<b>Adoption</b> = schrittweiser Übernahmeprozess einer Innovation durch einen Nachfrager. Phasen: <b>Wahrnehmung (Awareness) → Interesse → Bewertung → Versuch → Übernahme (Adoption).</b> Kenntnis hilft, eine effektive Markteinführung mit hoher Konversionsrate zu gestalten."},
  {c:"k3inno", q:"Diffusion neuer Produkte — Definition und Akteure?",
   a:"<b>Diffusion</b> = Ausbreitung einer Innovation im Markt im Zeitablauf. Abhängig von Produktkomplexität, Anbieterimage, Risikobereitschaft, Word-of-Mouth. Akteure: <b>Innovatoren</b> (Opinion Leader) und <b>Imitatoren</b> (Follower). Zunehmende Bedeutung von <b>Influencer-Marketing</b>."},
  {c:"k3inno", q:"Was kennzeichnet das Bass-Modell (1969)?",
   a:"Klassisches <b>Diffusionsmodell</b>, das <b>Innovatoren und Imitatoren</b> berücksichtigt. Kernproblem: frühzeitige, zuverlässige <b>Prognose des Absatzverlaufs</b> neuer Produkte. Erweiterung: Generalized Bass Model."},

  // ===== KAPITEL 3 – Etablierte Produkte =====
  {c:"k3etab", q:"Was ist Produktvariation (Definition, Ansatzpunkte, Motive)?",
   a:"<b>Modifikation von Eigenschaften eines bestehenden Produkts ohne Änderung der Kernfunktionen.</b> Ansatzpunkte: ästhetisch (Farbe/Form), physikalisch-funktional (Material/Qualität), symbolisch (Markenname/-image). Motive: Mängelbehebung, Anpassung an Präferenzen, Reaktion auf Wettbewerber, Kosteneinsparung."},
  {c:"k3etab", q:"Was ist Produktdifferenzierung (Definition, Formen, Motive)?",
   a:"<b>Ergänzung eines eingeführten Produkts um einen „Ableger“/eine neue Variante.</b> Formen: <b>vertikal</b> (unterschiedliche Qualitäts-/Preisebenen) und <b>horizontal</b> (gleiche Ebene, andere Ausprägung). Motive: neue Segmente, veränderte Präferenzen, höhere Preise, Markteintrittsbarrieren, <b>Imagetransfer</b>."},
  {c:"k3etab", q:"Kernunterschied Produktvariation vs. Produktdifferenzierung?",
   a:"Bei der <b>Variation bleibt die Produktanzahl</b> im Leistungsprogramm <b>konstant</b> (Ersatz), bei der <b>Differenzierung vergrößert</b> sie sich (Ergänzung um eine zusätzliche Variante)."},
  {c:"k3etab", q:"Was sind Value Added Services (VAS)?",
   a:"Zusatzleistungen zur Produktdifferenzierung. Kundenerwartung: <b>Muss-, Soll- und Kann-Leistungen</b>. Affinität von <b>Primär- und Sekundärleistung</b>: hoch/mittel/gering. Bezug zum <b>Kano-Modell</b> (Basis-, Leistungs-, Begeisterungsfaktoren)."},

  // ===== KAPITEL 3 – Markenpolitik =====
  {c:"k3mark", q:"Wie ist „Marke“ definiert (Esch)?",
   a:"<b>Vorstellungsbilder in den Köpfen der Anspruchsgruppen</b>, die eine <b>Identifikations- und Differenzierungsfunktion</b> übernehmen und das Wahlverhalten prägen. Marken sind Träger von Schlüsselinformationen (Entscheidungshilfe) und gelten als <b>„Herzstück der Produktpolitik“</b>."},
  {c:"k3mark", q:"Funktionen von Marken aus den drei Sichten?",
   a:"<b>Markenführer:</b> Differenzierung/Qualitätssignal, Präferenz/Loyalität, Markteintrittsbarrieren, Preispremium, Plattform für neue Produkte. <b>Absatzmittler:</b> Minderung des Absatzrisikos, Imagetransfer, geringerer Beratungsaufwand. <b>Nachfrager:</b> Orientierung/Informationsvereinfachung, Qualitätssignal/Risikoreduktion, Erlebniswert, Selbstdarstellung."},
  {c:"k3mark", q:"Ziele der Markenführung?",
   a:"<b>Ökonomisch</b> (Markenwert, Kundenstammwert, Akquisitions-/Bindungskosten), <b>psychografisch</b> (Bekanntheit, Image, Loyalität, Zufriedenheit, Weiterempfehlung) und <b>intern</b> (Markenstärke, Markenwissen, „Brand Commitment“, „Brand Citizenship Behavior“ (BCB), niedrige Mitarbeiterfluktuation)."},
  {c:"k3mark", q:"Markenerfolg / Brand Equity — welche Erfolgsgrößen?",
   a:"<b>Potenzialbezogen:</b> Markenbekanntheit, -image, markenbezogene Einstellungen. <b>Markterfolgsbezogen:</b> Marktanteil, Kundenloyalität, Preispremium. <b>Wirtschaftlich (Brand Value):</b> mit der Marke erzielter Umsatz/Gewinn, Markenwert in Geldeinheiten."},
  {c:"k3mark", q:"Markenidentität vs. Markenimage?",
   a:"<b>Markenidentität</b> = <b>Selbstbild</b> (Aussagenkonzept des Anbieters, wie die Marke sein soll). <b>Markenimage</b> = <b>Fremdbild</b> (Wahrnehmung/Vorstellungsbild bei den Nachfragern). Vermittelt über <b>Brand Touch Points</b>; Ziel ist eine hohe Übereinstimmung beider."},
  {c:"k3mark", q:"Brand Concept Mapping (BCM) — die 3 Schritte?",
   a:"(1) <b>Elicitation:</b> relevante Markenassoziationen erheben (freie Nennung/Stimuli). (2) <b>Mapping:</b> Probanden ordnen die Begriffe an und bewerten Verbindungsstärken. (3) <b>Aggregation:</b> statistische Zusammenführung zu einer <b>Consensus Map</b> (kollektives Markenimage)."},
  {c:"k3mark", q:"Markenpositionierung — Definition und Elemente?",
   a:"<b>Aktive, zielgerichtete Gestaltung der Stellung einer Marke</b> im Markt bzgl. subjektiv wahrgenommener Dimensionen. Zentrale Elemente: <b>Markenkern, Markennutzen, Markenpersönlichkeit</b>. Ggü. Wettbewerbern: <b>Points-of-Difference (PoD)</b> und <b>Points-of-Parity (PoP)</b>."},
  {c:"k3mark", q:"Nenne die 4 Markenstrategien mit Beispiel.",
   a:"<b>Einzelmarke</b> (je Produkt eigene Marke; z. B. tic tac, Nutella). <b>Mehrmarken/Multi-Branding</b> (mehrere Marken im selben Segment; z. B. Persil, Spee, Weißer Riese – Henkel). <b>Markenfamilie</b> (einheitliche Bezeichnung für eine Produktgruppe; z. B. Nivea, Dove). <b>Dachmarke/Corporate Branding</b> (Firmenname für alles; z. B. Siemens, Microsoft)."},
  {c:"k3mark", q:"Markenarchitekturen: House of Brands vs. Branded House?",
   a:"<b>House of Brands</b> (z. B. Procter & Gamble): viele eigenständige Einzelmarken unter einem Unternehmensdach, die Firma tritt kaum in Erscheinung. <b>Branded House</b> (Dachmarkenlogik, z. B. Unilever-Kommunikation): starke gemeinsame (Unternehmens-)Marke über den Produkten."},
  {c:"k3mark", q:"Optionen zur Weiterentwicklung der Markenarchitektur (Matrix)?",
   a:"Matrix <b>Marke (bestehend/neu) × Produktlinie (bestehend/neu)</b>: bestehende Marke + neue Linie = <b>Markentransfer (Brand Extension)</b>; bestehende Marke + bestehende Linie = <b>Linienausweitung (Line Extension)</b>; neue Marke + bestehende Linie = <b>Parallelmarken (Multi-Branding)</b>; neue Marke + neue Linie = <b>Neuentwicklung</b>."},
  {c:"k3mark", q:"Was ist eine Markenallianz (Definition, Formen, Ziele)?",
   a:"<b>Gleichzeitige, käuferfokussierte Präsentation von zwei oder mehr Marken</b>, um das Absatzpotenzial jedes Partners unter Nutzung der Markenwerte zu erhöhen. Formen: <b>Co-Promotion, Co-Branding, Ingredient Branding</b>. Ziele: Wettbewerbsvorteile, Markterschließung/Innovation, Imageverbesserung, Positionierungsspezifizierung."},
  {c:"k3mark", q:"Erfolgsfaktoren von Markenallianzen?",
   a:"<b>Organisationsebene:</b> Kompatibilität der Unternehmen („Partner Match“), Neutralisierung von Machtungleichgewichten, Kompromissbereitschaft, angemessene Verträge. <b>Produktebene:</b> Kompatibilität der Images („Brand Fit“), Verwandtschaft der Produktkategorien („Product Fit“), Markenvertrautheit (moderierend). Risiko: dissipative Qualitätssignale."},
  {c:"k3mark", q:"Was ist Markenpiraterie?",
   a:"Das Geschäft mit <b>nachgeahmten Produkten</b>, die einem Originalprodukt möglichst ähnlich sein sollen, um damit Profit oder sonstige Vorteile zu erzielen."},

  // ===== KAPITEL 3 – Verpackung & Sortiment =====
  {c:"k3sort", q:"Verpackungspolitik — Definition und Funktionen?",
   a:"<b>Sämtliche Maßnahmen rund um die Umhüllung von Produkten.</b> Funktionen: <b>Schutz/Sicherung</b> (Transport/Lagerung), Vermittlung eines <b>Zusatznutzens</b>, Dimensionierung für den Verkauf, <b>Warenpräsentation/Verkaufsförderung</b>, Ge-/Verbrauchserleichterung, <b>Kommunikation</b> (Markierungselemente), ökologische/gesellschaftliche Anforderungen, Rationalisierung der Warenwirtschaft."},
  {c:"k3sort", q:"Sortimentspolitik — Definition sowie Breite vs. Tiefe?",
   a:"<b>Sortimentspolitik</b> = Entscheidungen zu Erstellung und Umstrukturierung (Erweiterung/Eliminierung) von Leistungsangeboten. <b>Sortimentsbreite</b> = Anzahl der Produktlinien/Warengruppen (nebeneinander). <b>Sortimentstiefe</b> = Anzahl der Artikel innerhalb einer Produktlinie/Warengruppe."},
  {c:"k3sort", q:"Strategische Sortimentsentscheidungen (Erweiterung vs. Bereinigung)?",
   a:"<b>Erweiterung:</b> Ausdehnung innerhalb einer Linie (Trading down/up, Line Extension) oder neue Linien (Diversifikation horizontal/vertikal/lateral) — Risiko <b>Kannibalisierung</b>. <b>Bereinigung:</b> Sorten-/Typenreduktion, Spezialisierung, Modifikation/Produktverbesserung."},
  {c:"k3sort", q:"Produkteliminierung — Anlässe und Risiken?",
   a:"<b>Anlässe:</b> schrumpfender Markt, Wettbewerbsvorsprung der Konkurrenz, neue Vorschriften, sinkende Umsätze/Marktanteile/Deckungsbeiträge, hoher Kundendienstaufwand. <b>Risiken:</b> Fixkostendeckung (bei positivem DB), Imageeffekt (Klassiker), Kaufverbund, Know-how-Gap, Beziehungen zu Lieferanten/Kunden."},

  // ===== KAPITEL 4 – Preis-Grundlagen =====
  {c:"k4grund", q:"Lernziele Kapitel 4 — was solltest du können?",
   a:"Charakteristika/Elemente der <b>Preispolitik</b> erläutern; Instrumente der <b>individuellen Preisgestaltung</b> benennen; <b>strategische Ansatzpunkte</b> abgrenzen; <b>Preisdifferenzierung</b> skizzieren und Formen benennen; <b>Preisbündelung</b> als Sonderform erklären; <b>Methoden der Preisfestlegung</b> (kosten-, markt-, marginalanalytisch orientiert) verstehen und abgrenzen."},
  {c:"k4grund", q:"Definiere Preispolitik und ihre Charakteristika.",
   a:"<b>Preispolitik</b> = Festlegung der Art der Gegenleistungen, die Kunden für die Leistungen des Unternehmens entrichten. Charakteristika: hohe <b>Umsetzbarkeit</b>, große <b>Wirkungsstärke</b> („schärfste Marketingwaffe“), hohe <b>Wirkungsgeschwindigkeit</b>, aber <b>schwere Revidierbarkeit</b>."},
  {c:"k4grund", q:"Anlässe für preispolitische Entscheidungen?",
   a:"<b>Konsumentenbezogen</b> (verändertes Konsumverhalten), <b>handelsbezogen</b> (Handelsmarken), <b>unternehmensbezogen</b> (Kostenstruktur), <b>konkurrenzbezogen</b> (neue Produkte der Konkurrenz) und <b>umfeldbezogen</b> (z. B. Handelshemmnisse)."},
  {c:"k4grund", q:"Preis (Definition) und Instrumente der Preispolitik?",
   a:"<b>Preis</b> = von einem Nachfrager zu zahlender Geldbetrag für eine bestimmte Menge eines Guts. Instrumente: <b>Preisnachlässe</b> (Rabatte, Skonti, Boni), <b>Preiszuschläge</b> (Sonderleistungen, Mindermengen, Zeiten), <b>Zugaben</b> (Geld-/Sach-/Dienstleistungen) und <b>Freemium-Angebote</b> (Preis je Produktausstattung)."},
  {c:"k4grund", q:"Idealtypischer preispolitischer Planungsprozess?",
   a:"Festlegung preispolitischer Ziele → <b>Analyse des Spielraums</b> (kosten-, nachfrage-, konkurrenzbezogen) → Strategieentwicklung (Preispositionierung, Preiswettbewerb, Preisabfolge, Preisdifferenzierung) → Festlegung der Maßnahmen → <b>Preiskontrollen</b>; Integration in den Marketing-Mix."},

  // ===== KAPITEL 4 – Preisstrategien =====
  {c:"k4strat", q:"Die 3 Ansatzpunkte preispolitischer Strategien?",
   a:"<b>Preispositionierung:</b> Hoch-, Mittel-, Niedrigpreisstrategie. <b>Preiswettbewerb:</b> Preisführerschaft, Preiskampf, Preisfolgerschaft. <b>Preisabfolge:</b> Penetration- und Skimming-Strategie."},
  {c:"k4strat", q:"Penetrationsstrategie — Ziel, Motivation, Gefahren?",
   a:"<b>Ziel:</b> schnelle Markterschließung mit <b>niedrigen Einführungspreisen</b> und hohen Marktanteilen. <b>Motivation:</b> hohe Preiselastizität, Abschreckung der Konkurrenz, große Kapazitäten/Fixkosten, Niedrigpreissegmente. <b>Gefahren:</b> lange Amortisation, geringer preispolitischer Spielraum."},
  {c:"k4strat", q:"Skimmingstrategie — Ziel, Motivation, Gefahren?",
   a:"<b>Ziel:</b> schnelle Amortisation hoher Anfangsinvestitionen mit <b>hohen Einführungspreisen</b> („Abschöpfung“). <b>Motivation:</b> preisunelastische Nachfrage, kurze Lebenszyklen, Markteintrittsbarrieren (Patente), begrenzte Kapazitäten. <b>Gefahr:</b> hohe Preise/Gewinnchancen <b>locken Konkurrenten</b> an."},
  {c:"k4strat", q:"Preisdifferenzierung — Definition und die 3 Grade?",
   a:"<b>Definition:</b> Anbieter verkauft identische/leicht unterschiedliche Produkte in verschiedenen Segmenten zu <b>unterschiedlichen Preisen</b>. <b>1. Grades:</b> individueller Maximalpreis je Kunde („Basar“). <b>2. Grades:</b> Segmentpreise, Kunde wählt Segment <b>frei</b> (Economy vs. Business). <b>3. Grades:</b> Segmente nach beobachtbaren Merkmalen; Kunde kann Segment <b>nicht frei</b> wählen."},
  {c:"k4strat", q:"Implementationsformen der Preisdifferenzierung?",
   a:"<b>Zeitlich</b> (Tageszeit, Wochentag, Saison), <b>räumlich</b> (Länder, Regionen, Städte), <b>personell</b> (Kinder-, Schüler-, Beamtentarife), <b>leistungsbezogen</b> (Taschen- vs. gebundenes Buch), <b>quantitativ</b> (Grundgebühr, BahnCard) und <b>Preisbündelung</b>."},
  {c:"k4strat", q:"Weber'sches Gesetz in der Preiswahrnehmung?",
   a:"Reizunterschiede werden erst nach Überschreiten eines <b>Schwellenwertes</b> wahrgenommen. Eine Preisänderung wird <b>relativ zum Ausgangsniveau</b> beurteilt: eine gegebene Erhöhung/Senkung erscheint umso größer, je <b>geringer</b> das Ausgangsniveau ist."},
  {c:"k4strat", q:"Was ist Yield-/Revenue-Management?",
   a:"Ansatz der <b>simultanen und dynamischen Preis- und Kapazitätssteuerung</b>, um eine meist <b>fixe Kapazität gewinnmaximal auszuschöpfen</b>. Annahme: Der Wert einer (Dienst-)Leistung variiert je Nachfrager und Zeitpunkt. Ablauf u. a.: historische Nachfrage erfassen, Kundenwertigkeiten/Prognose, Kapazität planen, Preise bestimmen, dynamisch anpassen."},
  {c:"k4strat", q:"Bausteine des Revenue-Management-Prozesses?",
   a:"<b>Datengewinnung → Nachfrageprognose → Nachfragesteuerung → Kontrolle.</b> Steuerung <b>mengenbasiert</b> (Kapazitätssteuerung, <b>Überbuchung</b>) und <b>preisbasiert</b> (<b>Dynamic Pricing</b>). Überbuchung = mehr Tickets als Plätze, um Auslastung zu optimieren und No-Shows auszugleichen."},
  {c:"k4strat", q:"Was ist Preisbündelung?",
   a:"<b>Sonderform der Preisdifferenzierung</b>: verschiedene Produkte werden als <b>Paket zu einem Gesamtpreis</b> angeboten. Idee: Übertragung <b>ungenutzter Zahlungsbereitschaft</b> von einem Produkt auf ein anderes → stärkeres <b>Cross-Selling</b> und Absatzsteigerung. Formen: <b>reine</b> und <b>gemischte</b> Preisbündelung."},

  // ===== KAP 4 – Preisfestlegung =====
  {c:"k4meth", q:"Überblick: Welche Methoden der Preisfestlegung gibt es?",
   a:"<b>Kostenorientiert:</b> Vollkostenrechnung, Teilkostenrechnung. <b>Marktorientiert:</b> Break-Even-Analyse, Deckungsbeitragsrate, Preisfestlegung unter Unsicherheit. <b>Marginalanalytisch:</b> Monopol-, Oligopol-, Polypol-Ansatz. Grundsätzlich <b>statisch vs. dynamisch</b>."},
  {c:"k4meth", q:"Wann ist Einzelpreis, reine bzw. gemischte Preisbündelung vorteilhaft?",
   a:"<b>Einzelpreisstellung:</b> wenn der Nutzen der Produkte aus Nachfragersicht sehr <b>unterschiedlich</b> ist (Fall a). <b>Reine Bündelung:</b> wenn jeder Nachfrager den Produkten einen sehr <b>ähnlichen</b> Nutzen beimisst (Fall b). <b>Gemischte Bündelung:</b> wenn a und b <b>gemeinsam</b> auftreten (Fall c)."},
  {c:"k4meth", q:"Preisfestlegung nach Vollkostenrechnung (Cost-Plus-Pricing)?",
   a:"Alle Gesamt-Stückkosten <code>k_g = K / x</code> werden herangezogen; Preis über die Kosten-Plus-Regel: <code>p = k_g · (1 + λ)</code> mit λ &gt; 0 = Gewinnzuschlag. <b>Vorteil:</b> alle Kosten (auch Fixkosten) werden gedeckt. <b>Schwäche:</b> Fixkostenschlüsselung verzerrt Produktentscheidungen; ignoriert Nachfrage/Wettbewerb."},
  {c:"k4meth", q:"Preisfestlegung nach Teilkostenrechnung?",
   a:"Nur die <b>variablen Stückkosten</b> plus Zuschlag: <code>p = k_v · (1 + λ′)</code>. Fixkosten bleiben unberücksichtigt (Kostenaufspaltung fix/variabel). Liefert eine fundiertere Entscheidungshilfe für Preisentscheidungen als die Vollkostenrechnung."},
  {c:"k4meth", q:"Break-Even-Analyse — Grundidee und Formel?",
   a:"Gewinnschwelle ist erreicht, wenn <b>Kosten = Umsatz</b>. Break-Even-Menge: <code>x_BE = K_fix / (p − k_v)</code> — also Fixkosten geteilt durch den <b>Stück-Deckungsbeitrag</b> (p − k<sub>v</sub>)."},
  {c:"k4meth", q:"Deckungsbeitragsrate (DBR) — Definition und Break-Even-Umsatz?",
   a:"Anteil zur Deckung der Fixkosten und Gewinnerzielung je Preis-/Umsatzeinheit: <code>DBR = (p − k_v)/p = (U − K_v)/U</code>. Break-Even-Umsatz: <code>U_BE = K_fix / DBR</code>. Verdeutlicht die zur Überschreitung der Gewinnschwelle nötigen Mengen/Umsätze/Preise."},
  {c:"k4meth", q:"Preisgestaltung bei Unsicherheit — welcher Ansatz?",
   a:"<b>Erwartungswertmaximierung</b> bei unsicheren Marktreaktionen: <code>E_p = Σ_j e_pj · w_j</code> (e<sub>pj</sub> = Ergebnis bei Preis p und Umweltzustand j, w<sub>j</sub> = Wahrscheinlichkeit). Lösung häufig über einen <b>Entscheidungsbaum</b>."},

  // ===== KAP 4 – Marginalanalyse =====
  {c:"k4marg", q:"Was ist die Preis-Absatz-Funktion (PAF)?",
   a:"Funktionaler Zusammenhang zwischen <b>Preis und erwarteter Absatzmenge</b> (Marktreaktion auf Preisänderungen). Grundannahme: sinkende Menge bei steigendem Preis. <b>Lineare PAF:</b> <code>x(p) = a − b·p</code> mit Sättigungsmenge <code>x = a</code> (bei p=0) und Prohibitivpreis <code>p = a/b</code> (bei x=0). <b>Nichtlinear (Cobb-Douglas):</b> <code>x(p) = a · p^(−b)</code>."},
  {c:"k4marg", q:"Preiselastizität der Nachfrage — Definition und Interpretation?",
   a:"Um wie viel % ändert sich der Absatz x, wenn sich der Preis p um 1 % ändert. <b>Punktelastizität:</b> <code>ε = (dx/dp) · (p/x)</code>. <b>|ε| &lt; 1</b>: unelastisch, <b>|ε| &gt; 1</b>: elastisch. Über die <b>Amoroso-Robinson-Relation</b> lässt sich das Umsatzmaximum bestimmen (bei |ε| = 1)."},
  {c:"k4marg", q:"Statisch-optimaler Preis im Monopol bei Gewinnmaximierung (Cournot)?",
   a:"Bedingung: <b>Grenzumsatz = Grenzkosten</b>. Bei linearer PAF <code>x = a − b·p</code> und linearen Kosten: <b>Cournot-Menge</b> <code>x* = (a − b·k_v)/2</code>, <b>Cournot-Preis</b> <code>p* = (a + b·k_v)/(2b)</code>. Der Cournot-Preis liegt genau in der Mitte zwischen k<sub>v</sub> und Prohibitivpreis."},
  {c:"k4marg", q:"Monopol: Rentabilitäts- vs. Gewinnmaximum?",
   a:"Das <b>Rentabilitätsmaximum</b> (R = Gewinn / Kapitalbedarf) ist erreicht, wenn — bezogen auf die Menge — die <b>Grenzrentabilität = Durchschnittsrentabilität</b> ist (bzw. Elastizität des Gewinns = Elastizität des Kapitalbedarfs). Es liegt bei <b>kleinerer Menge / höherem Preis</b> als das Gewinnmaximum."},
  {c:"k4marg", q:"Preisfestlegung im Oligopol?",
   a:"Wenige mittelgroße/große Anbieter, viele kleine Nachfrager (einfachster Fall: Duopol). <b>Konkurrenzgebundenheit:</b> Preisänderungen lösen Reaktionen der Konkurrenz aus. Die PAF ist <b>doppelt geknickt</b> mit einem quasi-monopolistischen, „reaktionsfreien“ Bereich → <b>Gutenberg-PAF</b>."},
  {c:"k4marg", q:"Preisfestlegung im Polypol — welche zwei Formen?",
   a:"Viele kleine Anbieter/Nachfrager. (1) <b>Vollkommener (homogener) Markt → atomistische Konkurrenz:</b> keine Präferenzen, volle Transparenz, unendliche Reaktionsgeschwindigkeit, <b>Gleichgewichtspreis</b>. (2) <b>Unvollkommener (heterogener) Markt → polypolistische Konkurrenz:</b> örtliche/zeitliche/sachliche/persönliche Präferenzen; zweifach geknickte PAF (monopolistischer Bereich in der Mitte, atomistische Bereiche oben/unten)."},

  // ===== KAP 5 – Grundlagen =====
  {c:"k5grund", q:"Lernziele Kapitel 5 — was solltest du können?",
   a:"Charakteristika/Elemente der <b>Kommunikationspolitik</b> erläutern; <b>Kommunikationsstrategien</b> benennen; Ansätze der <b>Kommunikationsplanung</b> abgrenzen; <b>Instrumente des Kommunikationsmix</b> (auch digital) erläutern; <b>Verteilung des Werbebudgets</b> und Methoden skizzieren; <b>Werbebotschaften</b> gestalten; <b>integrierte Marketingkommunikation</b> und <b>Wirkungsmessung</b> beschreiben."},
  {c:"k5grund", q:"Kommunikation (Definition) und die Lasswell-Formel?",
   a:"<b>Kommunikation</b> = Austausch von Informationen zwischen <b>Sender und Empfänger</b>. Lasswell-Mehrdimensionalität: <b>Wer</b> (Sender) sagt <b>was</b> (Information) unter welchen <b>Bedingungen</b>, auf welchem <b>Kanal</b> (Medium), auf welche <b>Art</b> (Gestaltung), zu <b>wem</b> (Empfänger), mit welcher <b>Wirkung</b> (Effekt)?"},
  {c:"k5grund", q:"Definiere Kommunikationspolitik und ihre Maßnahmenbereiche.",
   a:"<b>Gesamtheit der Kommunikationsinstrumente und -maßnahmen</b>, um Unternehmen/Leistungen den Zielgruppen darzustellen bzw. mit Anspruchsgruppen zu interagieren. Bereiche: <b>marktgerichtete externe</b> (z. B. Anzeigenwerbung), <b>innerbetriebliche interne</b> (z. B. Mitarbeiterzeitung) und <b>interaktive</b> Kommunikation (z. B. Beratungschat). Unterschied: Massen- vs. Individualkommunikation."},
  {c:"k5grund", q:"Entwicklungsphasen der Kommunikationspolitik?",
   a:"(1) unsystematische Kommunikation (bis 1950er) → (2) Produkt- → (3) Zielgruppen- → (4) Wettbewerbs- → (5) Kommunikationswettbewerb → (6) Dialog- (2000er) → (7) Netzwerk- (2010er) → (8) <b>KI-gestützte Kommunikation</b> (2020er)."},
  {c:"k5grund", q:"Push- vs. Pull-Strategie der Kommunikation?",
   a:"<b>Push</b> („in den Markt drücken“): der Hersteller richtet seine Aktivitäten an den Handel, der das Produkt weiter an die Käufer drückt. <b>Pull</b> („Bedarfe/Präferenzen wecken“): der Hersteller adressiert überwiegend die Endverbraucher, sodass diese das Produkt im Handel <b>nachfragen</b>."},

  // ===== KAP 5 – Planung =====
  {c:"k5plan", q:"Idealtypischer Planungsprozess der Kommunikationspolitik?",
   a:"Analyse der Kommunikationssituation → Festlegung der <b>Kommunikationsziele</b> (ökonomisch/psychologisch) → Planung der <b>Zielgruppen</b> → Festlegung der <b>Strategie</b> → Festlegung des <b>Budgets</b> → <b>Maßnahmenplanung</b>/Instrumenteneinsatz → <b>Erfolgskontrolle</b>; Integration in den Marketing-Mix."},
  {c:"k5plan", q:"Zielgruppe (Definition) — und wie unterscheidet sie sich vom Marktsegment?",
   a:"<b>Zielgruppe</b> = die mit einer Kommunikationsbotschaft anzusprechenden <b>Empfänger (Rezipienten)</b>. Sie ist <b>nicht</b> mit dem Marktsegment identisch. Teilaufgaben: <b>Identifikation</b> (Wer?), <b>Beschreibung</b> (Alter/Präferenzen/Lebensstil), <b>Erreichbarkeit</b> (über welche Medien?)."},
  {c:"k5plan", q:"Formen der Werbewirkung und die Rolle der Aktivierung?",
   a:"<b>Momentane Wirkungen</b> (unmittelbar zum Werbekontakt), <b>dauerhafte Gedächtniswirkungen</b> (inneres, nicht beobachtbares Verhalten) und <b>finale Verhaltenswirkungen</b> (beobachtbares Langzeitverhalten). <b>Aktivierung</b> = Zustand psychischer Wachheit/Erregung durch Reize — unbewusst, unspezifisch, <b>notwendige Voraussetzung</b> aller psychischen Prozesse."},
  {c:"k5plan", q:"Was besagt das AIDA-Schema — und welche Botschaftsaspekte gibt es?",
   a:"<b>A</b>ttention (Aufmerksamkeit) → <b>I</b>nterest (Interesse) → <b>D</b>esire (Kaufwunsch) → <b>A</b>ction (Kauf). Botschafts<b>inhalt</b>: rational / emotional / moralisch. <b>Struktur</b>: ein- vs. zweiseitige Argumentation, stärkstes Argument zuerst/zuletzt (<b>Primacy-Recency-Effekt</b>), Storytelling."},

  // ===== KAP 5 – Instrumente =====
  {c:"k5inst", q:"Mediawerbung (Definition) und Werbezielkategorien?",
   a:"<b>Transport werblicher Informationen</b> über die Belegung von Werbeträgern mit Werbemitteln im öffentlichen Umfeld gegen Entgelt. Werbezielkategorien: <b>kognitiv</b> (Aufmerksamkeit, Bekanntheit, Wissen), <b>affektiv</b> (Interesse, Einstellung/Image, Positionierung, Emotion) und <b>konativ</b> (Kaufabsichten, Probier-/Wiederholungskäufe)."},
  {c:"k5inst", q:"Werbestrategie — Definition und die 4 Dimensionen?",
   a:"Globaler, mittel-/langfristiger Verhaltensplan zum Einsatz von Werbeträgern/-mitteln zur Zielerreichung. 4 Dimensionen: <b>Wer</b> (Werbeobjekt) sagt <b>was</b> (Werbebotschaft), <b>wie</b> (Werbeträger/-mittel) zu <b>wem</b> (Werbezielgruppe)? Kernbotschaft → „Unique Advertising Proposition“."},
  {c:"k5inst", q:"Verkaufsförderung (Sales Promotion) — Definition und Ziele?",
   a:"Meist <b>zeitlich befristete Maßnahmen mit Aktionscharakter</b>, die durch zusätzliche Anreize Kommunikations-/Vertriebsziele erreichen. <b>Operativ:</b> kurzfristiger Abverkauf am Point-of-Sale, Bekanntmachung, Probierkäufe. <b>Strategisch:</b> Handelsunterstützung/-akzeptanz, Marken-/Unternehmensprofilierung, Wettbewerbsvorteile."},
  {c:"k5inst", q:"Direktmarketing — Definition und drei Ausprägungen?",
   a:"Kommunikationsmaßnahmen zur <b>gezielten Einzelansprache</b> mit direktem Kontakt/Dialog. <b>Passiv:</b> Aufmerksamkeit lenken (Kataloge, unadressierte Mailings). <b>Aktiv reaktionsorientiert:</b> Reaktion ermöglichen (Mail-Order-Packages, Rückantwortkarten). <b>Aktiv interaktionsorientiert:</b> unmittelbarer Dialog (Telefon-/Messenger-Marketing → „Permission Marketing“, DSGVO beachten)."},
  {c:"k5inst", q:"Public Relations (PR) — Definition und drei Formen?",
   a:"Aktivitäten, um bei internen/externen Zielgruppen um <b>Verständnis und Vertrauen</b> zu werben. Formen: <b>leistungsorientierte PR</b> (Produktmerkmale), <b>unternehmensbezogene PR</b> (Selbstverständnis/Bild des Unternehmens) und <b>gesellschaftsbezogene PR</b> (verantwortungsvolles Handeln)."},
  {c:"k5inst", q:"Sponsoring — Definition, Ziele und Erscheinungsformen?",
   a:"Bereitstellung von Geld/Sachmitteln/Know-how zur <b>Förderung von Personen/Organisationen</b> (Sport, Kultur, Soziales, Umwelt, Medien) bei gleichzeitiger Verfolgung von Kommunikationszielen. Ziele: Bekanntheit, Image, Kontaktpflege, Goodwill, Mitarbeitermotivation. Formen: <b>Sport-, Kultur-, Sozial-/Umwelt-, Mediensponsoring</b>."},
  {c:"k5inst", q:"Messen & Ausstellungen — Ziele, Nutzen, Probleme?",
   a:"<b>Ziele:</b> Geschäftsbeziehungen anbahnen/pflegen, Wettbewerbsposition bestimmen, Abschlüsse vorbereiten. <b>Nutzen:</b> hohe Konzentration von Angebot/Nachfrage, Kommunikationsdichte, persönlicher Kontakt, direkter Wettbewerbsvergleich. <b>Probleme:</b> hohe Kosten und Organisationsaufwand, geringe Disponibilität → hybride Messekonzepte/Events."},
  {c:"k5inst", q:"Online-Kommunikation — Definition und Eigenschaften?",
   a:"Kommunikationsaktivitäten über das Internet Protocol (Unternehmen↔Nachfrager sowie Nachfrager untereinander). Eigenschaften: <b>unmittelbares Feedback</b>, aktive Info-Anforderung, hohe <b>Aktualität (Echtzeit)</b>, globale <b>24/7-Verfügbarkeit</b>, <b>Hypermedialität</b> (nichtlineare Inhalte). Instrumente: Website, E-Mail-/Messenger-Marketing, Display, SEM (SEO/SEA)."},
  {c:"k5inst", q:"Virale und Metaverse-Kommunikation?",
   a:"<b>Virale Kommunikation:</b> nutzt soziale Netzwerke/Internet, um durch „virengleiche“ Ausbreitung (v. a. Mundpropaganda) Aufmerksamkeit zu erzeugen (Videos, Memes, Influencer-Posts, Gewinnspiele, Storytelling). <b>Metaverse-Kommunikation:</b> Kommunikation zu Produkten/Marken in immersiven virtuellen 3D-Umgebungen (z. B. via Avatare)."},

  // ===== KAP 5 – Werbebudget =====
  {c:"k5budg", q:"Werbebudgetierung — heuristische vs. analytische Ansätze?",
   a:"<b>Heuristisch</b> (geringer Infobedarf, aber ohne Ursache-Wirkung): unternehmensbezogen (Prozentsatz einer Bezugsgröße, „All-you-can-afford“), konkurrenzbezogen (Werbeanteils-Marktanteils-Methode, Wettbewerbsparität), marktbezogen (Ziel-Aufgaben-Methode). <b>Analytisch</b>: Marginalanalyse über Reaktions-/Wirkungsfunktionen (Problem: Ermittlung, Zurechnung, ceteris paribus). Kompromiss: <b>Decision-Calculus</b>-Ansätze."},
  {c:"k5budg", q:"Werbestreuplanung — Definition, Aufteilung, Ziel?",
   a:"<b>Zielgruppengerechte Aufteilung des Werbeetats auf Werbeträger/Medien.</b> <b>Sachlich</b> (Produkte/Marken, Werbeträger/-mittel, Regionen/Zielgruppen) und <b>zeitlich</b> (Zeitpunkt, Dauer, Rhythmus). Ergebnis: <b>Mediaplan</b>; Ziel: <b>Minimierung von Streuverlusten</b> (hohe Affinität). Ebenen: Inter- und Intra-Mediaselektion."},
  {c:"k5budg", q:"Wichtige Kenngrößen zur Medienbewertung?",
   a:"<b>Reichweite</b>, <b>Kontaktfrequenz</b>/Durchschnittskontakte, <b>Tausenderkontaktpreis (TKP)</b> = Kosten für 1.000 Kontakte in der Zielgruppe, <b>Affinitätsindex</b> und <b>Gross Rating Points (GRP)</b> = Nettoreichweite (%) × mittlere Kontaktanzahl (Werbedruck)."},
  {c:"k5budg", q:"Reichweiten-Begriffe: brutto, netto, kumuliert, quantitativ/qualitativ?",
   a:"<b>Quantitativ/qualitativ:</b> alle bzw. qualitativ definierte Personen mit Werbeträgerkontakt. <b>Bruttoreichweite:</b> Summe aller Kontakte. <b>Nettoreichweite:</b> Kontakte nach Abzug <b>aller</b> Überschneidungen (extern = versch. Medien, intern = mehrere Ausgaben). <b>Kumulierte Reichweite:</b> erreichte Personen bei mehreren Auflagen nach Abzug interner Überschneidungen."},
  {c:"k5budg", q:"Verfahren der Werbestreuplanung?",
   a:"<b>Rangreihenverfahren</b> (nach Nettoreichweiten, gewichteten Nettoreichweiten, GRP oder TKP), <b>Evaluierungsverfahren</b> (Bewertung vorgegebener Streupläne per Scoring) und <b>Optimierungsverfahren</b> (optimale Streupläne unter Nebenbedingungen, z. B. lineare Programmierung)."},

  // ===== KAP 5 – Wirkung & IMK =====
  {c:"k5wirk", q:"Gestaltung der Werbebotschaft — Inhalt, Form, Aktivierungsreize?",
   a:"<b>Inhalt:</b> informativ/kausal-argumentativ vs. psychologisch-emotional. <b>Form:</b> optische/akustische/multisensuale Zeichen (Duale Kodierung nach Paivio). <b>Aktivierungsreize:</b> emotional (Kinder, Erotik, Tiere), kognitiv (Überraschung, Widerspruch), physisch (Duft, Farbe, Ton), ökonomisch („Preishammer“) und wertebasiert (Umwelt, Bildung)."},
  {c:"k5wirk", q:"Integrierte Marketingkommunikation (IMK) und Corporate Identity?",
   a:"<b>IMK</b> = Koordination/Integration aller Botschaften über alle Kanäle und Instrumente (inhaltlich + formal), um eine <b>klare, einheitliche, überzeugende Botschaft</b> zu senden; Voraussetzung: Kenntnis aller Touch Points. Ergebnis: <b>Corporate Identity</b> aus Corporate <b>Behaviour</b>, <b>Communication</b>, <b>Design</b> und Culture."},
  {c:"k5wirk", q:"Messung der Kommunikationswirkung — Perspektiven und Wirkungen?",
   a:"<b>Werbewirkungsmessung</b> und <b>Werbeerfolgsmessung</b> (Prognose → <b>Pretest</b>, Kontrolle → <b>Posttest</b>). Operationalisierte Wirkungen: Aufmerksamkeit (<b>Stopping/Holding/Sending Power</b>), Gedächtnis (gestützte/ungestützte Erinnerung, Wiedererkennung), Evaluation (Einstellungs-/Präferenzänderung)."},
  {c:"k5wirk", q:"Messmethoden und Web/Social-Media-Analytics-Kennzahlen?",
   a:"<b>Methoden:</b> apparativ (Eye-Tracking, Tachistoskop, MRT/CT), Beobachtung, Befragung. <b>Web Analytics:</b> Page/Ad Impressions, <b>Click-through Rate</b>, Visits, <b>Unique/New Visitors</b>, Usetime, <b>Bounce Rate</b> und <b>Conversion Rate</b> (Umwandlung Besucher→Kunde, „Conversion Funnel“ ↔ AIDA)."},

  // ===== KAP 6 – Grundlagen =====
  {c:"k6grund", q:"Lernziele Kapitel 6 — was solltest du können?",
   a:"Charakteristika/Elemente der <b>Vertriebspolitik</b> erläutern; den <b>Planungsprozess</b> skizzieren; Gestaltung/Beurteilung von <b>Vertriebssystemen</b> begründen; <b>Betriebstypen des Handels</b> abgrenzen; <b>vertragliche Vertriebssysteme</b> benennen; <b>Vergütungssysteme</b> skizzieren; Elemente von <b>Logistiksystemen</b> erläutern."},
  {c:"k6grund", q:"Vertriebspolitik (Definition) — akquisitorischer vs. physischer Vertrieb?",
   a:"<b>Vertriebspolitik</b> = Entscheidungen zur direkten/indirekten Versorgung der Kunden mit Leistungen. <b>Akquisitorischer Vertrieb (Distribution):</b> Management der Distributionswege (Absatzkanäle, vertragliche Bindung, Verkaufsorgane). <b>Physischer/logistischer Vertrieb:</b> physische Übermittlung + Informationsflüsse („Überwindung von Raum und Zeit“). Basisentscheidungen: Vertriebssysteme, Verkaufsorgane, Logistiksysteme."},
  {c:"k6grund", q:"Planungsprozess der Vertriebspolitik + Zielarten?",
   a:"Analyse der Vertriebssituation → Festlegung der <b>Ziele</b> → <b>Strategie</b> (akquisitorisch/logistisch) → Budget → Maßnahmen → <b>Kontrolle</b>. Zielarten: <b>ökonomisch</b> (Absatz, Preisniveau, Kostensenkung), <b>versorgungsorientiert</b> (Distributionsgrad, Lieferzeiten, Lagerbestände) und <b>psychologisch</b> (Vertriebsimage, Kooperationsbereitschaft des Handels)."},
  {c:"k6grund", q:"Push- vs. Pull-Strategie im Vertrieb; Multi-Channel-Vertrieb?",
   a:"<b>Push</b> (absatzmittlergerichtet): Verkaufsdruck über den Zwischenhandel. <b>Pull</b> (absatznehmergerichtet): Nachfragesog durch Endkundenansprache. <b>Multi-Channel-Vertrieb:</b> parallele Nutzung <b>direkter und indirekter</b> Kanäle zur Umsatz-/Ertragssteigerung — getrieben von Wettbewerb, Kundenansprüchen und Technologie."},

  // ===== KAP 6 – Betriebstypen =====
  {c:"k6beurt", q:"Methoden zur Beurteilung von Vertriebssystemen/Betriebstypen?",
   a:"<b>Punktbewertung/multiattributive Nutzwertanalyse</b>, <b>Stärken-Schwächen-Analyse</b> (Betriebstypenprofile), <b>Gain-and-Loss-Analyse</b>, <b>Portfolioanalyse</b> (Attraktivität × Wettbewerbsposition), <b>Investitionsrechnung</b> (vertragliche Systeme) und <b>Conjoint-Analyse</b> (bestpassendes Betriebstypen-Profil)."},
  {c:"k6beurt", q:"Einzelhandel vs. Großhandel — Aufgaben?",
   a:"<b>Einzelhandel:</b> Verkauf an Endverbraucher (nicht-gewerblich); Überbrückung von Raum/Zeit; Quantitäts-, Kredit-, Werbe-, Sortimentsbildungs- und Qualitätsfunktion. <b>Großhandel:</b> Zusammenfassung der Lieferungen von Produzenten/Importeuren und Verteilung an Wiederverkäufer/Einzelhändler; Lagerhaltungs-, Quantitäts-, Qualitäts- und Beratungsfunktion."},
  {c:"k6beurt", q:"Formen des (stationären) Einzelhandels?",
   a:"<b>Fachgeschäft</b> (tiefes Sortiment, Beratung), <b>Spezialgeschäft</b> (sehr tief, schmal), <b>Warenhaus</b> (breit, branchenübergreifend, „alles unter einem Dach“), <b>Kaufhaus</b> (branchenorientiert), <b>Versandhaus</b>, <b>Internetshop</b>, <b>Supermarkt</b>, <b>Verbrauchermarkt</b> (breiter/tiefer), <b>Discounter</b> (preisaggressiv, minimaler Service), <b>Fachmarkt</b> (Warengruppe, günstig)."},
  {c:"k6beurt", q:"Formen des Großhandels?",
   a:"<b>Zustellgroßhandel</b> (liefert auf Bestellung), <b>Cash-and-Carry</b> (Abholung + Sofortzahlung, z. B. Metro), <b>Rack-Jobber</b> (Regalpflege im EH auf eigenes Risiko), <b>Streckengroßhandel</b> (Abschluss beim GH, Ware direkt vom Hersteller), <b>Sortimentsgroßhandel</b> (breit/flach) und <b>Spezialgroßhandel</b> (eng/tief)."},

  // ===== KAP 6 – Kontrakte & Vertrieb =====
  {c:"k6kontr", q:"Kontraktkonzepte / vertragliche Vertriebssysteme?",
